<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DBD Match Tracker V2</title>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #141418;
      --card-header: #1c1c22;
      --accent-red: #d92b2b;
      --accent-orange: #e67e22;
      --accent-green: #2ecc71;
      --text-color: #e0e0e0;
      --text-muted: #8e8e99;
      --border-color: #262630;
      --perk-bg: #1e1e26;
      --perk-border: #3a3a4a;
      --perk-accent: #8e44ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Trebuchet MS', 'Segoe UI', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    body {
      padding: 12px;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
      font-size: 1.4rem;
      text-shadow: 0 0 10px rgba(217, 43, 43, 0.6);
    }

    /* Streak Bar */
    .streak-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .streak-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      text-transform: uppercase;
      font-weight: bold;
    }

    .streak-dots {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0;
    }

    .streak-dot {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: white;
      flex-shrink: 0;
    }
    .streak-dot.green { background: var(--accent-green); }
    .streak-dot.orange { background: var(--accent-orange); }
    .streak-dot.red { background: var(--accent-red); }

    /* Controls */
    .search-box {
      margin-bottom: 8px;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      font-size: 16px;
    }

    .category-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
    }

    .cat-btn {
      flex: 1;
      padding: 8px;
      background: #1a1a22;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }

    .cat-btn:active {
      background: var(--accent-red);
    }

    /* Main Button */
    .btn-main {
      display: block;
      width: 100%;
      padding: 12px;
      background: var(--accent-red);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 12px rgba(217, 43, 43, 0.3);
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 10px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }

    /* Custom Auto-complete Dropdown (Vrai menu déroulant sous l'input) */
    .dropdown-container {
      position: relative;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      margin-bottom: 4px;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      background: #0b0b0e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      font-size: 16px;
    }

    .custom-dropdown-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #1a1a24;
      border: 1px solid var(--accent-red);
      border-radius: 0 0 6px 6px;
      max-height: 150px;
      overflow-y: auto;
      z-index: 2000;
      display: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .custom-dropdown-list.active {
      display: block;
    }

    .dropdown-item {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border-color);
      color: #fff;
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item:hover, .dropdown-item:active {
      background: var(--accent-red);
    }

    .perks-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .perk-box {
      background: var(--perk-bg);
      border: 1px dashed var(--perk-border);
      border-radius: 6px;
      padding: 6px 8px;
      position: relative;
    }

    .perk-label {
      font-size: 0.65rem;
      color: var(--perk-accent);
      font-weight: bold;
      text-transform: uppercase;
    }

    .perk-input {
      background: transparent !important;
      border: none !important;
      padding: 2px 0 !important;
      font-size: 14px !important;
      color: #fff !important;
    }

    .radio-group {
      display: flex;
      gap: 6px;
    }

    .radio-option {
      flex: 1;
      text-align: center;
    }

    .radio-option input { display: none; }

    .radio-option label {
      display: block;
      padding: 8px 4px;
      background: #0b0b0e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-color);
      font-weight: bold;
    }

    .radio-option input:checked + label.lbl-red { background: var(--accent-red); color: white; }
    .radio-option input:checked + label.lbl-orange { background: var(--accent-orange); color: white; }
    .radio-option input:checked + label.lbl-green { background: var(--accent-green); color: white; }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-secondary {
      background: #2a2a35;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 8px 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.8rem;
    }

    .tab-btn.active {
      background: #22222c;
      color: white;
      border-color: #555;
    }

    /* List & Cards */
    .match-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 12px;
      border-left: 5px solid var(--border-color);
      position: relative;
    }

    .match-card.status-red { border-left-color: var(--accent-red); }
    .match-card.status-orange { border-left-color: var(--accent-orange); }
    .match-card.status-green { border-left-color: var(--accent-green); }

    .card-actions {
      position: absolute;
      top: 10px; right: 10px;
      display: flex; gap: 6px;
    }

    .btn-icon {
      background: none; border: none; color: var(--text-muted); cursor: pointer;
    }

    .card-killer { font-size: 1rem; font-weight: bold; color: #fff; }
    .card-map { font-size: 0.8rem; color: var(--text-muted); font-style: italic; }

    .card-details {
      display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.8rem; margin: 6px 0; color: #ccc;
      background: #0b0b0e; padding: 6px 8px; border-radius: 6px;
    }

    .card-perks-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .card-perk-tag {
      background: var(--perk-bg); border: 1px solid var(--perk-border); color: #d1c4e9;
      padding: 2px 6px; border-radius: 4px; font-size: 0.75rem;
    }

    .saved-items-list {
      list-style: none;
      margin-top: 10px;
      max-height: 250px;
      overflow-y: auto;
    }

    .saved-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: #0b0b0e;
      border: 1px solid var(--border-color);
      margin-bottom: 4px;
      border-radius: 4px;
    }

    .saved-item button {
      background: var(--accent-red);
      color: white;
      border: none;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>DBD Match Tracker</h1>

  <div class="streak-container">
    <span class="streak-title">Derniers Matchs:</span>
    <div class="streak-dots" id="streak-dots">
      <span style="color:var(--text-muted); font-size:0.75rem;">Aucune partie</span>
    </div>
  </div>

  <div class="search-box">
    <input type="text" id="search-bar" class="search-input" placeholder="🔍 Rechercher..." oninput="render()">
  </div>
  
  <div class="category-nav">
    <button class="cat-btn" onclick="openCategoryModal('survivors')">👤 Survivants</button>
    <button class="cat-btn" onclick="openCategoryModal('killers')">🔪 Tueurs</button>
    <button class="cat-btn" onclick="openCategoryModal('maps')">🗺️ Maps</button>
    <button class="cat-btn" onclick="openCategoryModal('perks')">⚡ Perks</button>
  </div>

  <button class="btn-main" onclick="openModal()">+ Ajouter une partie</button>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('all', event)">Tous</button>
    <button class="tab-btn" onclick="switchTab('green', event)">🟢 Porte</button>
    <button class="tab-btn" onclick="switchTab('orange', event)">🟠 Trappe</button>
    <button class="tab-btn" onclick="switchTab('red', event)">🔴 Non sorti</button>
  </div>

  <div id="match-list" class="match-list"></div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modal-title" style="margin-bottom: 10px;">Nouvelle Partie</h2>
      <form id="match-form">
        <input type="hidden" id="match-id">

        <div class="form-group dropdown-container">
          <label for="survivor">Survivant joué</label>
          <input type="text" id="survivor" placeholder="Sélectionnez ou tapez..." autocomplete="off">
          <div class="custom-dropdown-list" id="drop-survivor"></div>
        </div>
        
        <div class="form-group dropdown-container">
          <label for="killer">Tueur</label>
          <input type="text" id="killer" required placeholder="Sélectionnez ou tapez..." autocomplete="off">
          <div class="custom-dropdown-list" id="drop-killer"></div>
        </div>

        <div class="form-group dropdown-container">
          <label for="map">Map</label>
          <input type="text" id="map" placeholder="Sélectionnez ou tapez..." autocomplete="off">
          <div class="custom-dropdown-list" id="drop-map"></div>
        </div>

        <div style="display:flex; gap:8px;">
          <div class="form-group" style="flex:1;">
            <label for="gens">Générateurs</label>
            <input type="number" id="gens" min="0" max="5" value="5">
          </div>
          <div class="form-group" style="flex:1;">
            <label for="escaped">Évadés (0-4)</label>
            <input type="number" id="escaped" min="0" max="4" value="1">
          </div>
        </div>

        <div class="form-group">
          <label>Tes Perks (4 Emplacements)</label>
          <div class="perks-grid">
            <div class="perk-box dropdown-container">
              <span class="perk-label">P1</span>
              <input type="text" id="perk1" class="perk-input" placeholder="Perk..." autocomplete="off">
              <div class="custom-dropdown-list" id="drop-perk1"></div>
            </div>
            <div class="perk-box dropdown-container">
              <span class="perk-label">P2</span>
              <input type="text" id="perk2" class="perk-input" placeholder="Perk..." autocomplete="off">
              <div class="custom-dropdown-list" id="drop-perk2"></div>
            </div>
            <div class="perk-box dropdown-container">
              <span class="perk-label">P3</span>
              <input type="text" id="perk3" class="perk-input" placeholder="Perk..." autocomplete="off">
              <div class="custom-dropdown-list" id="drop-perk3"></div>
            </div>
            <div class="perk-box dropdown-container">
              <span class="perk-label">P4</span>
              <input type="text" id="perk4" class="perk-input" placeholder="Perk..." autocomplete="off">
              <div class="custom-dropdown-list" id="drop-perk4"></div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Résultat</label>
          <div class="radio-group">
            <div class="radio-option"><input type="radio" id="out-red" name="status" value="red" checked><label for="out-red" class="lbl-red">Mort 🔴</label></div>
            <div class="radio-option"><input type="radio" id="out-orange" name="status" value="orange"><label for="out-orange" class="lbl-orange">Trappe 🟠</label></div>
            <div class="radio-option"><input type="radio" id="out-green" name="status" value="green"><label for="out-green" class="lbl-green">Porte 🟢</label></div>
          </div>
        </div>

        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" placeholder="Remarques..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeModal('modal')">Annuler</button>
          <button type="submit" class="btn-main" style="margin:0; flex:1;">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal" id="cat-modal">
    <div class="modal-content">
      <h3 id="cat-title" style="margin-bottom:8px;">Gestion des éléments</h3>
      <div style="display:flex; gap:6px; margin-bottom: 10px;">
        <input type="text" id="new-cat-item" placeholder="Ajouter manuellement..." style="flex:1; padding:8px; background:#0b0b0e; border:1px solid var(--border-color); color:#fff; border-radius:4px; font-size:16px;">
        <button onclick="addManualCatItem()" style="background:var(--accent-green); color:white; border:none; padding:8px 12px; border-radius:4px; font-weight:bold;">+</button>
      </div>
      <ul class="saved-items-list" id="cat-items-list"></ul>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal('cat-modal')">Fermer</button>
      </div>
    </div>
  </div>

  <script>
    // Storage Initialisation & Rétrocompatibilité
    let matches = JSON.parse(localStorage.getItem('dbd_matches')) || [];
    let savedPerks = JSON.parse(localStorage.getItem('dbd_saved_perks')) || [];
    let savedSurvivors = JSON.parse(localStorage.getItem('dbd_saved_survivors')) || [];
    let savedKillers = JSON.parse(localStorage.getItem('dbd_saved_killers')) || [];
    let savedMaps = JSON.parse(localStorage.getItem('dbd_saved_maps')) || [];

    // Extraction automatique des 50 anciennes parties enregistrées dans tes options
    matches.forEach(m => {
      if (m.survivor && !savedSurvivors.includes(m.survivor)) savedSurvivors.push(m.survivor);
      if (m.killer && !savedKillers.includes(m.killer)) savedKillers.push(m.killer);
      if (m.map && m.map !== 'Map non spécifiée' && !savedMaps.includes(m.map)) savedMaps.push(m.map);
      if (m.perks && Array.isArray(m.perks)) {
        m.perks.forEach(p => { if (p && !savedPerks.includes(p)) savedPerks.push(p); });
      }
    });

    localStorage.setItem('dbd_saved_survivors', JSON.stringify(savedSurvivors));
    localStorage.setItem('dbd_saved_killers', JSON.stringify(savedKillers));
    localStorage.setItem('dbd_saved_maps', JSON.stringify(savedMaps));
    localStorage.setItem('dbd_saved_perks', JSON.stringify(savedPerks));

    let currentTab = 'all';
    let activeCategoryType = '';

    // Gestion du VRAI Menu Déroulant (Dropdown Custom sur mesure)
    function setupCustomDropdown(inputId, dropId, itemsList) {
      const input = document.getElementById(inputId);
      const drop = document.getElementById(dropId);

      function showDropdown() {
        closeAllDropdowns();
        const filter = input.value.toLowerCase();
        drop.innerHTML = '';

        const matchingItems = itemsList.filter(item => item.toLowerCase().includes(filter));

        if (matchingItems.length === 0) {
          drop.classList.remove('active');
          return;
        }

        matchingItems.sort().forEach(item => {
          const div = document.createElement('div');
          div.className = 'dropdown-item';
          div.innerText = item;
          div.onmousedown = function(e) {
            e.preventDefault();
            input.value = item;
            drop.classList.remove('active');
          };
          drop.appendChild(div);
        });

        drop.classList.add('active');
      }

      input.addEventListener('focus', showDropdown);
      input.addEventListener('input', showDropdown);
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.custom-dropdown-list').forEach(d => d.classList.remove('active'));
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.dropdown-container')) {
        closeAllDropdowns();
      }
    });

    function initAllDropdowns() {
      setupCustomDropdown('survivor', 'drop-survivor', savedSurvivors);
      setupCustomDropdown('killer', 'drop-killer', savedKillers);
      setupCustomDropdown('map', 'drop-map', savedMaps);
      setupCustomDropdown('perk1', 'drop-perk1', savedPerks);
      setupCustomDropdown('perk2', 'drop-perk2', savedPerks);
      setupCustomDropdown('perk3', 'drop-perk3', savedPerks);
      setupCustomDropdown('perk4', 'drop-perk4', savedPerks);
    }

    /* Modal Gestion Catégories */
    function openCategoryModal(type) {
      activeCategoryType = type;
      const titleMap = {
        'survivors': '👤 Liste des Survivants',
        'killers': '🔪 Liste des Tueurs',
        'maps': '🗺️ Liste des Maps',
        'perks': '⚡ Liste des Perks'
      };
      document.getElementById('cat-title').innerText = titleMap[type];
      renderCategoryList();
      document.getElementById('cat-modal').classList.add('active');
    }

    function renderCategoryList() {
      const listEl = document.getElementById('cat-items-list');
      listEl.innerHTML = '';
      let targetArray = getArrayByType(activeCategoryType);

      if (targetArray.length === 0) {
        listEl.innerHTML = '<li style="color:var(--text-muted); font-size:0.8rem; padding:8px;">Aucun enregistrement pour le moment.</li>';
        return;
      }

      targetArray.sort().forEach(item => {
        const li = document.createElement('li');
        li.className = 'saved-item';
        li.innerHTML = `<span>${escapeHtml(item)}</span><button onclick="removeCatItem('${escapeHtml(item)}')">✕</button>`;
        listEl.appendChild(li);
      });
    }

    function getArrayByType(type) {
      if (type === 'survivors') return savedSurvivors;
      if (type === 'killers') return savedKillers;
      if (type === 'maps') return savedMaps;
      if (type === 'perks') return savedPerks;
      return [];
    }

    function addManualCatItem() {
      const input = document.getElementById('new-cat-item');
      const val = input.value.trim();
      if (!val) return;
      let targetArray = getArrayByType(activeCategoryType);

      if (!targetArray.includes(val)) {
        targetArray.push(val);
        saveArrayByType(activeCategoryType);
        initAllDropdowns();
        renderCategoryList();
      }
      input.value = '';
    }

    function removeCatItem(item) {
      let targetArray = getArrayByType(activeCategoryType);
      const index = targetArray.indexOf(item);
      if (index !== -1) {
        targetArray.splice(index, 1);
        saveArrayByType(activeCategoryType);
        initAllDropdowns();
        renderCategoryList();
      }
    }

    function saveArrayByType(type) {
      if (type === 'survivors') localStorage.setItem('dbd_saved_survivors', JSON.stringify(savedSurvivors));
      if (type === 'killers') localStorage.setItem('dbd_saved_killers', JSON.stringify(savedKillers));
      if (type === 'maps') localStorage.setItem('dbd_saved_maps', JSON.stringify(savedMaps));
      if (type === 'perks') localStorage.setItem('dbd_saved_perks', JSON.stringify(savedPerks));
    }

    function openModal(editId = null) {
      document.getElementById('match-form').reset();
      document.getElementById('match-id').value = '';
      closeAllDropdowns();

      if (editId) {
        const m = matches.find(x => x.id === editId);
        if (m) {
          document.getElementById('match-id').value = m.id;
          document.getElementById('survivor').value = m.survivor || '';
          document.getElementById('killer').value = m.killer || '';
          document.getElementById('map').value = m.map || '';
          document.getElementById('gens').value = m.gens;
          document.getElementById('escaped').value = m.escaped;
          document.getElementById('notes').value = m.notes || '';
          document.querySelector(`input[name="status"][value="${m.status}"]`).checked = true;
          const p = m.perks || [];
          document.getElementById('perk1').value = p[0] || '';
          document.getElementById('perk2').value = p[1] || '';
          document.getElementById('perk3').value = p[2] || '';
          document.getElementById('perk4').value = p[3] || '';
        }
      }
      initAllDropdowns();
      document.getElementById('modal').classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
      closeAllDropdowns();
    }

    document.getElementById('match-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('match-id').value;
      const survivor = document.getElementById('survivor').value.trim();
      const killer = document.getElementById('killer').value.trim() || 'Tueur Inconnu';
      const map = document.getElementById('map').value.trim() || 'Map non spécifiée';
      const gens = document.getElementById('gens').value;
      const status = document.querySelector('input[name="status"]:checked').value;
      const escaped = document.getElementById('escaped').value;
      const notes = document.getElementById('notes').value.trim();

      const perks = [
        document.getElementById('perk1').value.trim(),
        document.getElementById('perk2').value.trim(),
        document.getElementById('perk3').value.trim(),
        document.getElementById('perk4').value.trim()
      ].filter(p => p !== '');

      // Auto-Enregistrement
      if (survivor && !savedSurvivors.includes(survivor)) { savedSurvivors.push(survivor); saveArrayByType('survivors'); }
      if (killer && !savedKillers.includes(killer)) { savedKillers.push(killer); saveArrayByType('killers'); }
      if (map && map !== 'Map non spécifiée' && !savedMaps.includes(map)) { savedMaps.push(map); saveArrayByType('maps'); }
      perks.forEach(p => { if (!savedPerks.includes(p)) savedPerks.push(p); });
      saveArrayByType('perks');

      if (id) {
        const idx = matches.findIndex(m => m.id === id);
        if (idx !== -1) matches[idx] = { id, survivor, killer, map, gens, status, escaped, notes, perks };
      } else {
        matches.unshift({ id: Date.now().toString(), survivor, killer, map, gens, status, escaped, notes, perks });
      }

      localStorage.setItem('dbd_matches', JSON.stringify(matches));
      closeModal('modal');
      render();
    });

    function deleteMatch(id) {
      if (confirm('Supprimer cette partie ?')) {
        matches = matches.filter(m => m.id !== id);
        localStorage.setItem('dbd_matches', JSON.stringify(matches));
        render();
      }
    }

    function switchTab(tab, e) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (e) e.currentTarget.classList.add('active');
      render();
    }

    function render() {
      const searchQuery = document.getElementById('search-bar').value.toLowerCase();
      const listContainer = document.getElementById('match-list');
      listContainer.innerHTML = '';

      // Streak Render
      const streakContainer = document.getElementById('streak-dots');
      streakContainer.innerHTML = '';
      const recentMatches = matches.slice(0, 10).reverse();
      if (recentMatches.length === 0) {
        streakContainer.innerHTML = '<span style="color:var(--text-muted); font-size:0.75rem;">Aucune partie</span>';
      } else {
        recentMatches.forEach(m => {
          const dot = document.createElement('div');
          dot.className = `streak-dot ${m.status}`;
          dot.innerText = m.status === 'green' ? 'P' : m.status === 'orange' ? 'T' : 'X';
          streakContainer.appendChild(dot);
        });
      }

      const filtered = matches.filter(m => {
        const matchesTab = (currentTab === 'all') || (m.status === currentTab);
        const matchesSearch = !searchQuery || 
          m.killer.toLowerCase().includes(searchQuery) ||
          m.map.toLowerCase().includes(searchQuery) ||
          (m.survivor && m.survivor.toLowerCase().includes(searchQuery)) ||
          (m.perks && m.perks.some(p => p.toLowerCase().includes(searchQuery)));
        return matchesTab && matchesSearch;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:20px;">Aucun enregistrement.</div>';
        return;
      }

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = `match-card status-${m.status}`;
        let statusText = m.status === 'green' ? '🟢 Porte' : m.status === 'orange' ? '🟠 Trappe' : '🔴 Mort';

        card.innerHTML = `
          <div class="card-actions">
            <button class="btn-icon" onclick="openModal('${m.id}')">✏️</button>
            <button class="btn-icon" onclick="deleteMatch('${m.id}')">🗑️</button>
          </div>
          <div class="card-killer">🔪 ${escapeHtml(m.killer)}</div>
          <div class="card-map">🗺️ ${escapeHtml(m.map)}</div>
          <div class="card-details">
            ${m.survivor ? `<span>👤 <b>${escapeHtml(m.survivor)}</b></span>` : ''}
            <span>⚡ Gen: <b>${m.gens}/5</b></span>
            <span>Résultat: <b>${statusText}</b></span>
          </div>
          ${m.perks && m.perks.length > 0 ? `<div class="card-perks-list">${m.perks.map(p => `<span class="card-perk-tag">${escapeHtml(p)}</span>`).join('')}</div>` : ''}
        `;
        listContainer.appendChild(card);
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    }

    // Init App
    initAllDropdowns();
    render();
  </script>
</body>
</html>
