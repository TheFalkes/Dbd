<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DBD Match Tracker V4</title>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #141418;
      --card-header: #1c1c22;
      --accent-red: #d92b2b;
      --accent-orange: #e67e22;
      --accent-green: #2ecc71;
      --accent-blue: #3498db;
      --accent-purple: #9b59b6;
      --text-color: #e0e0e0;
      --text-muted: #8e8e99;
      --border-color: #262630;
      --perk-bg: #1e1e26;
      --perk-border: #3a3a4a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Trebuchet MS', 'Segoe UI', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 12px;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-size: 1.3rem;
      text-shadow: 0 0 10px rgba(217, 43, 43, 0.5);
    }

    /* Mode Switcher Header */
    .mode-switch-container {
      display: flex;
      background: #111116;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 12px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: bold;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .mode-btn.active-surv {
      background: var(--accent-blue);
      color: #fff;
    }

    .mode-btn.active-killer {
      background: var(--accent-red);
      color: #fff;
    }

    /* Main Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .nav-btn {
      flex: 1;
      padding: 8px 4px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .nav-btn.active {
      background: #252530;
      color: #fff;
    }

    /* Sub-filters (Outcome Bar) */
    .filter-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .sub-filter-btn {
      flex: 1;
      padding: 6px 8px;
      background: #121216;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
    }

    .sub-filter-btn.active {
      border-color: #fff;
      color: #fff;
      background: #1e1e28;
    }

    /* Buttons */
    .btn-main {
      width: 100%;
      padding: 12px;
      background: var(--accent-red);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .search-box {
      margin-bottom: 10px;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      font-size: 15px;
    }

    /* Cards & Lists */
    .match-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 12px;
      border-left: 5px solid var(--border-color);
      position: relative;
    }

    .card-actions {
      position: absolute;
      top: 10px; right: 10px;
      display: flex; gap: 8px;
    }

    .btn-icon {
      background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.9rem;
    }

    .card-title { font-size: 0.95rem; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 6px; }
    .card-sub { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-top: 2px; }

    .card-details {
      display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.78rem; margin: 6px 0; color: #ccc;
      background: #0b0b0e; padding: 6px 8px; border-radius: 6px; align-items: center;
    }

    .card-perks-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .card-perk-tag {
      background: var(--perk-bg); border: 1px solid var(--perk-border); color: #d1c4e9;
      padding: 2px 6px; border-radius: 4px; font-size: 0.72rem; display: flex; align-items: center; gap: 4px;
    }

    /* Thumbnails */
    .img-thumb {
      width: 20px; height: 20px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color);
    }
    .img-thumb.square { border-radius: 4px; }
    .img-thumb.large { width: 45px; height: 45px; }

    /* Modals */
    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 1000; padding: 10px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
      padding: 16px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
    }

    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; margin-bottom: 4px; color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 9px; background: #0b0b0e; border: 1px solid var(--border-color); border-radius: 6px; color: white; font-size: 15px;
    }

    /* Dropdown UI */
    .dropdown-container { position: relative; }
    .custom-dropdown-list {
      position: absolute; top: 100%; left: 0; right: 0; background: #1a1a24;
      border: 1px solid var(--accent-red); border-radius: 0 0 6px 6px; max-height: 140px;
      overflow-y: auto; z-index: 2000; display: none;
    }
    .custom-dropdown-list.active { display: block; }
    .dropdown-item { padding: 8px 10px; cursor: pointer; font-size: 0.85rem; border-bottom: 1px solid var(--border-color); color: #fff; }
    .dropdown-item:hover { background: var(--accent-red); }

    .radio-group { display: flex; gap: 4px; }
    .radio-option { flex: 1; text-align: center; }
    .radio-option input { display: none; }
    .radio-option label {
      display: block; padding: 7px 2px; background: #0b0b0e; border: 1px solid var(--border-color);
      border-radius: 6px; cursor: pointer; font-size: 0.75rem; color: var(--text-color); font-weight: bold;
    }
    .radio-option input:checked + label { background: var(--accent-blue); color: white; }

    .perks-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .perk-box { background: var(--perk-bg); border: 1px dashed var(--perk-border); border-radius: 6px; padding: 4px 6px; }
    .perk-label { font-size: 0.6rem; color: var(--accent-purple); font-weight: bold; }
    .perk-input { background: transparent !important; border: none !important; padding: 2px 0 !important; font-size: 13px !important; color: #fff !important; }

    /* Custom Views */
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; text-align: center; }
    .stat-val { font-size: 1.3rem; font-weight: bold; color: #fff; }
    .stat-lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }

    .stat-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-bottom: 12px; }
    .stat-table th, .stat-table td { padding: 6px; text-align: left; border-bottom: 1px solid var(--border-color); }
    .stat-table th { color: var(--text-muted); font-size: 0.68rem; text-transform: uppercase; }

    .saved-list { list-style: none; max-height: 200px; overflow-y: auto; }
    .saved-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; background: #0b0b0e; border: 1px solid var(--border-color); margin-bottom: 4px; border-radius: 4px; font-size: 0.85rem;}
  </style>
</head>
<body>

  <h1>DBD Match Tracker</h1>

  <!-- Header Mode Switcher -->
  <div class="mode-switch-container">
    <button id="mode-surv-btn" class="mode-btn active-surv" onclick="switchRoleMode('survivor')">👤 Mode Survivant</button>
    <button id="mode-killer-btn" class="mode-btn" onclick="switchRoleMode('killer')">🔪 Mode Tueur</button>
  </div>

  <!-- Main Nav Tabs -->
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchNavTab('matches', event)">🎮 Matchs</button>
    <button class="nav-btn" onclick="switchNavTab('random', event)">🎲 Random</button>
    <button class="nav-btn" onclick="switchNavTab('stats', event)">📊 Stats</button>
    <button class="nav-btn" onclick="switchNavTab('settings', event)">⚙️ Gestion</button>
  </div>

  <!-- Matches View Container -->
  <div id="view-matches">
    <button class="btn-main" id="add-match-btn" onclick="openMatchModal()">+ Nouvelle Partie</button>
    
    <div class="search-box">
      <input type="text" id="search-bar" class="search-input" placeholder="🔍 Rechercher..." oninput="render()">
    </div>

    <!-- Outcome Filter Bar -->
    <div class="filter-bar" id="sub-filter-bar"></div>

    <div id="match-list" class="match-list"></div>
  </div>

  <!-- Random View -->
  <div id="view-random" style="display: none;"></div>

  <!-- Stats View -->
  <div id="view-stats" style="display: none;"></div>

  <!-- Settings / Management View -->
  <div id="view-settings" style="display: none;"></div>

  <!-- Modal Match Form -->
  <div class="modal" id="match-modal">
    <div class="modal-content">
      <h3 id="modal-title" style="margin-bottom: 10px;">Partie</h3>
      <form id="match-form">
        <input type="hidden" id="match-id">

        <!-- Dynamic Survivor/Killer inputs -->
        <div id="form-role-fields"></div>

        <!-- Map -->
        <div class="form-group dropdown-container">
          <label for="form-map">Map</label>
          <input type="text" id="form-map" placeholder="Sélectionnez ou tapez..." autocomplete="off">
          <div class="custom-dropdown-list" id="drop-form-map"></div>
        </div>

        <!-- Dynamic Game Stats fields -->
        <div id="form-stats-fields"></div>

        <!-- Perks Section -->
        <div class="form-group">
          <label id="perk-section-label">Perks Équipées</label>
          <div class="perks-grid">
            <div class="perk-box dropdown-container">
              <span class="perk-label">P1</span>
              <input type="text" id="perk1" class="perk-input" placeholder="Perk..." autocomplete="off">
              <div class="custom-dropdown-list" id="drop-perk1"></div>
            </div>
            <div class="perk-box dropdown-container">
              <span class="perk-label">P2</span>
              <input type="text" id="perk2" class="perk-input" placeholder="Perk..." autocomplete="off">
              <div class="custom-dropdown-list" id="drop-perk2"></div>
            </div>
            <div class="perk-box dropdown-container">
              <span class="perk-label">P3</span>
              <input type="text" id="perk3" class="perk-input" placeholder="Perk..." autocomplete="off">
              <div class="custom-dropdown-list" id="drop-perk3"></div>
            </div>
            <div class="perk-box dropdown-container">
              <span class="perk-label">P4</span>
              <input type="text" id="perk4" class="perk-input" placeholder="Perk..." autocomplete="off">
              <div class="custom-dropdown-list" id="drop-perk4"></div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="form-notes">Notes</label>
          <textarea id="form-notes" rows="2" placeholder="Remarques sur la game..."></textarea>
        </div>

        <div style="display:flex; gap:8px; margin-top:12px;">
          <button type="button" class="btn-main" style="background:#2a2a35; margin:0;" onclick="closeModal('match-modal')">Annuler</button>
          <button type="submit" class="btn-main" style="margin:0; flex:1;">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // LocalStorage Data
    let matches = JSON.parse(localStorage.getItem('dbd_v4_matches')) || [];
    let savedSurvivors = JSON.parse(localStorage.getItem('dbd_v4_survivors')) || [];
    let savedKillers = JSON.parse(localStorage.getItem('dbd_v4_killers')) || [];
    let savedMaps = JSON.parse(localStorage.getItem('dbd_v4_maps')) || [];
    let savedPerksSurv = JSON.parse(localStorage.getItem('dbd_v4_perks_surv')) || [];
    let savedPerksKiller = JSON.parse(localStorage.getItem('dbd_v4_perks_killer')) || [];
    let savedImages = JSON.parse(localStorage.getItem('dbd_v4_images')) || {};

    // State Variables
    let currentRole = 'survivor'; // 'survivor' or 'killer'
    let currentNavTab = 'matches'; // 'matches', 'random', 'stats', 'settings'
    let currentOutcomeFilter = 'all';

    // Switch Survivor / Killer Mode
    function switchRoleMode(role) {
      currentRole = role;
      document.getElementById('mode-surv-btn').className = `mode-btn ${role === 'survivor' ? 'active-surv' : ''}`;
      document.getElementById('mode-killer-btn').className = `mode-btn ${role === 'killer' ? 'active-killer' : ''}`;
      
      currentOutcomeFilter = 'all';
      setupSubFilterBar();
      render();
    }

    // Switch Main Nav Tab
    function switchNavTab(tab, event) {
      currentNavTab = tab;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (event) event.currentTarget.classList.add('active');

      document.getElementById('view-matches').style.display = tab === 'matches' ? 'block' : 'none';
      document.getElementById('view-random').style.display = tab === 'random' ? 'block' : 'none';
      document.getElementById('view-stats').style.display = tab === 'stats' ? 'block' : 'none';
      document.getElementById('view-settings').style.display = tab === 'settings' ? 'block' : 'none';

      render();
    }

    // Outcome Filter Sub-Bar
    function setupSubFilterBar() {
      const bar = document.getElementById('sub-filter-bar');
      bar.innerHTML = '';

      let filters = [];
      if (currentRole === 'survivor') {
        filters = [
          { id: 'all', label: 'Tous' },
          { id: 'green', label: '🟢 Porte' },
          { id: 'orange', label: '🟠 Trappe' },
          { id: 'red', label: '🔴 Mort' }
        ];
      } else {
        filters = [
          { id: 'all', label: 'Tous' },
          { id: '4k', label: '☠️ 4K' },
          { id: '3k', label: '💀 3K' },
          { id: '2k', label: '⚔️ 2K' },
          { id: '1k', label: '🩸 1K' },
          { id: '0k', label: '🤡 0K' }
        ];
      }

      filters.forEach(f => {
        const btn = document.createElement('button');
        btn.className = `sub-filter-btn ${currentOutcomeFilter === f.id ? 'active' : ''}`;
        btn.innerText = f.label;
        btn.onclick = () => {
          currentOutcomeFilter = f.id;
          setupSubFilterBar();
          renderMatches();
        };
        bar.appendChild(btn);
      });
    }

    // Custom Dropdown Helper
    function setupCustomDropdown(inputId, dropId, itemsList, imgPrefix) {
      const input = document.getElementById(inputId);
      const drop = document.getElementById(dropId);
      if (!input || !drop) return;

      function showDropdown() {
        closeAllDropdowns();
        const filter = input.value.toLowerCase();
        drop.innerHTML = '';

        const matching = itemsList.filter(item => item.toLowerCase().includes(filter));
        if (matching.length === 0) return;

        matching.sort().forEach(item => {
          const div = document.createElement('div');
          div.className = 'dropdown-item';
          const imgKey = `${imgPrefix}_${item}`;
          const imgSrc = savedImages[imgKey];
          const imgHtml = imgSrc ? `<img src="${imgSrc}" class="img-thumb ${imgPrefix.includes('perks') || imgPrefix.includes('maps') ? 'square' : ''}"> ` : '';
          
          div.innerHTML = `${imgHtml}${escapeHtml(item)}`;
          div.onmousedown = (e) => {
            e.preventDefault();
            input.value = item;
            drop.classList.remove('active');
          };
          drop.appendChild(div);
        });

        drop.classList.add('active');
      }

      input.onfocus = showDropdown;
      input.oninput = showDropdown;
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.custom-dropdown-list').forEach(d => d.classList.remove('active'));
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.dropdown-container')) closeAllDropdowns();
    });

    // Modal Opening & Form Build
    function openMatchModal(editId = null) {
      document.getElementById('match-form').reset();
      document.getElementById('match-id').value = '';

      const roleFields = document.getElementById('form-role-fields');
      const statsFields = document.getElementById('form-stats-fields');
      const perkLabel = document.getElementById('perk-section-label');

      if (currentRole === 'survivor') {
        perkLabel.innerText = '⚡ Perks Survivant (4 Emplacements)';
        roleFields.innerHTML = `
          <div class="form-group dropdown-container">
            <label for="form-survivor">Survivant joué</label>
            <input type="text" id="form-survivor" placeholder="Sélectionnez..." autocomplete="off">
            <div class="custom-dropdown-list" id="drop-form-survivor"></div>
          </div>
          <div class="form-group dropdown-container">
            <label for="form-killer">Tueur affronté</label>
            <input type="text" id="form-killer" required placeholder="Sélectionnez..." autocomplete="off">
            <div class="custom-dropdown-list" id="drop-form-killer"></div>
          </div>
        `;

        statsFields.innerHTML = `
          <div style="display:flex; gap:8px;">
            <div class="form-group" style="flex:1;">
              <label for="form-gens">Gens faits</label>
              <input type="number" id="form-gens" min="0" max="5" value="5">
            </div>
            <div class="form-group" style="flex:1;">
              <label for="form-escaped">Survivants partis</label>
              <input type="number" id="form-escaped" min="0" max="4" value="1">
            </div>
          </div>
          <div class="form-group">
            <label>Résultat</label>
            <div class="radio-group">
              <div class="radio-option"><input type="radio" id="res-red" name="outcome" value="red" checked><label for="res-red">Mort 🔴</label></div>
              <div class="radio-option"><input type="radio" id="res-orange" name="outcome" value="orange"><label for="res-orange">Trappe 🟠</label></div>
              <div class="radio-option"><input type="radio" id="res-green" name="outcome" value="green"><label for="res-green">Porte 🟢</label></div>
            </div>
          </div>
        `;
      } else {
        perkLabel.innerText = '⚡ Perks Tueur (4 Emplacements)';
        roleFields.innerHTML = `
          <div class="form-group dropdown-container">
            <label for="form-killer">Tueur joué</label>
            <input type="text" id="form-killer" required placeholder="Sélectionnez..." autocomplete="off">
            <div class="custom-dropdown-list" id="drop-form-killer"></div>
          </div>
        `;

        statsFields.innerHTML = `
          <div class="form-group">
            <label>Nombre de Kills (Kills faits)</label>
            <div class="radio-group">
              <div class="radio-option"><input type="radio" id="k-0" name="kills" value="0"><label for="k-0">0K 🤡</label></div>
              <div class="radio-option"><input type="radio" id="k-1" name="kills" value="1"><label for="k-1">1K 🩸</label></div>
              <div class="radio-option"><input type="radio" id="k-2" name="kills" value="2"><label for="k-2">2K ⚔️</label></div>
              <div class="radio-option"><input type="radio" id="k-3" name="kills" value="3"><label for="k-3">3K 💀</label></div>
              <div class="radio-option"><input type="radio" id="k-4" name="kills" value="4" checked><label for="k-4">4K ☠️</label></div>
            </div>
          </div>
          <div style="display:flex; gap:8px;">
            <div class="form-group" style="flex:1;">
              <label for="form-gens">Gens faits p/ surv</label>
              <input type="number" id="form-gens" min="0" max="5" value="0">
            </div>
            <div class="form-group" style="flex:1;">
              <label for="form-escaped">Survivants échappés</label>
              <input type="number" id="form-escaped" min="0" max="4" value="0">
            </div>
          </div>
        `;
      }

      // Setup dropdowns inside modal
      setupCustomDropdown('form-map', 'drop-form-map', savedMaps, 'maps');
      setupCustomDropdown('form-killer', 'drop-form-killer', savedKillers, 'killers');
      if (currentRole === 'survivor') {
        setupCustomDropdown('form-survivor', 'drop-form-survivor', savedSurvivors, 'survivors');
      }

      const activePerksList = currentRole === 'survivor' ? savedPerksSurv : savedPerksKiller;
      const perkPrefix = currentRole === 'survivor' ? 'perks_surv' : 'perks_killer';
      setupCustomDropdown('perk1', 'drop-perk1', activePerksList, perkPrefix);
      setupCustomDropdown('perk2', 'drop-perk2', activePerksList, perkPrefix);
      setupCustomDropdown('perk3', 'drop-perk3', activePerksList, perkPrefix);
      setupCustomDropdown('perk4', 'drop-perk4', activePerksList, perkPrefix);

      // Edit Mode Data Population
      if (editId) {
        const m = matches.find(x => x.id === editId);
        if (m) {
          document.getElementById('match-id').value = m.id;
          document.getElementById('form-killer').value = m.killer || '';
          document.getElementById('form-map').value = m.map || '';
          document.getElementById('form-gens').value = m.gens || 0;
          document.getElementById('form-escaped').value = m.escaped || 0;
          document.getElementById('form-notes').value = m.notes || '';

          if (m.role === 'survivor') {
            document.getElementById('form-survivor').value = m.survivor || '';
            const rad = document.querySelector(`input[name="outcome"][value="${m.outcome}"]`);
            if (rad) rad.checked = true;
          } else {
            const rad = document.querySelector(`input[name="kills"][value="${m.kills}"]`);
            if (rad) rad.checked = true;
          }

          const p = m.perks || [];
          document.getElementById('perk1').value = p[0] || '';
          document.getElementById('perk2').value = p[1] || '';
          document.getElementById('perk3').value = p[2] || '';
          document.getElementById('perk4').value = p[3] || '';
        }
      }

      document.getElementById('match-modal').classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
      closeAllDropdowns();
    }

    // Save Match
    document.getElementById('match-form').onsubmit = (e) => {
      e.preventDefault();
      const id = document.getElementById('match-id').value;
      const killer = document.getElementById('form-killer').value.trim() || 'Tueur Inconnu';
      const map = document.getElementById('form-map').value.trim() || 'Map Inconnue';
      const gens = parseInt(document.getElementById('form-gens').value) || 0;
      const escaped = parseInt(document.getElementById('form-escaped').value) || 0;
      const notes = document.getElementById('form-notes').value.trim();

      const perks = [
        document.getElementById('perk1').value.trim(),
        document.getElementById('perk2').value.trim(),
        document.getElementById('perk3').value.trim(),
        document.getElementById('perk4').value.trim()
      ].filter(p => p !== '');

      // Save new Auto-complete items
      if (killer && !savedKillers.includes(killer)) { savedKillers.push(killer); localStorage.setItem('dbd_v4_killers', JSON.stringify(savedKillers)); }
      if (map && map !== 'Map Inconnue' && !savedMaps.includes(map)) { savedMaps.push(map); localStorage.setItem('dbd_v4_maps', JSON.stringify(savedMaps)); }

      let matchData = { id: id || Date.now().toString(), role: currentRole, killer, map, gens, escaped, notes, perks };

      if (currentRole === 'survivor') {
        const survivor = document.getElementById('form-survivor').value.trim();
        const outcome = document.querySelector('input[name="outcome"]:checked').value;
        if (survivor && !savedSurvivors.includes(survivor)) { savedSurvivors.push(survivor); localStorage.setItem('dbd_v4_survivors', JSON.stringify(savedSurvivors)); }
        
        perks.forEach(p => { if (!savedPerksSurv.includes(p)) savedPerksSurv.push(p); });
        localStorage.setItem('dbd_v4_perks_surv', JSON.stringify(savedPerksSurv));

        matchData.survivor = survivor;
        matchData.outcome = outcome;
      } else {
        const kills = document.querySelector('input[name="kills"]:checked').value;
        perks.forEach(p => { if (!savedPerksKiller.includes(p)) savedPerksKiller.push(p); });
        localStorage.setItem('dbd_v4_perks_killer', JSON.stringify(savedPerksKiller));

        matchData.kills = kills;
      }

      if (id) {
        const idx = matches.findIndex(m => m.id === id);
        if (idx !== -1) matches[idx] = matchData;
      } else {
        matches.unshift(matchData);
      }

      localStorage.setItem('dbd_v4_matches', JSON.stringify(matches));
      closeModal('match-modal');
      render();
    };

    function deleteMatch(id) {
      if (confirm('Supprimer cette partie ?')) {
        matches = matches.filter(m => m.id !== id);
        localStorage.setItem('dbd_v4_matches', JSON.stringify(matches));
        render();
      }
    }

    // Render Handler
    function render() {
      if (currentNavTab === 'matches') renderMatches();
      if (currentNavTab === 'random') renderRandom();
      if (currentNavTab === 'stats') renderStats();
      if (currentNavTab === 'settings') renderSettings();
    }

    // Render Matches List
    function renderMatches() {
      const container = document.getElementById('match-list');
      const search = document.getElementById('search-bar').value.toLowerCase();
      container.innerHTML = '';

      const roleMatches = matches.filter(m => m.role === currentRole);

      const filtered = roleMatches.filter(m => {
        // Outcome filter
        let passOutcome = false;
        if (currentOutcomeFilter === 'all') passOutcome = true;
        else if (currentRole === 'survivor') passOutcome = m.outcome === currentOutcomeFilter;
        else if (currentRole === 'killer') passOutcome = m.kills === currentOutcomeFilter.replace('k', '');

        // Search filter
        const passSearch = !search || 
          m.killer.toLowerCase().includes(search) ||
          m.map.toLowerCase().includes(search) ||
          (m.survivor && m.survivor.toLowerCase().includes(search)) ||
          (m.perks && m.perks.some(p => p.toLowerCase().includes(search)));

        return passOutcome && passSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:20px; font-size:0.85rem;">Aucun enregistrement trouvé.</div>';
        return;
      }

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = 'match-card';

        // Images
        const killerImg = savedImages[`killers_${m.killer}`];
        const killerImgHtml = killerImg ? `<img src="${killerImg}" class="img-thumb">` : '';

        const mapImg = savedImages[`maps_${m.map}`];
        const mapImgHtml = mapImg ? `<img src="${mapImg}" class="img-thumb square">` : '';

        const perkPrefix = m.role === 'survivor' ? 'perks_surv' : 'perks_killer';

        if (m.role === 'survivor') {
          const survImg = m.survivor ? savedImages[`survivors_${m.survivor}`] : null;
          const survImgHtml = survImg ? `<img src="${survImg}" class="img-thumb">` : '';
          const statusText = m.outcome === 'green' ? '🟢 Porte' : m.outcome === 'orange' ? '🟠 Trappe' : '🔴 Mort';
          card.style.borderLeftColor = m.outcome === 'green' ? 'var(--accent-green)' : m.outcome === 'orange' ? 'var(--accent-orange)' : 'var(--accent-red)';

          card.innerHTML = `
            <div class="card-actions">
              <button class="btn-icon" onclick="openMatchModal('${m.id}')">✏️</button>
              <button class="btn-icon" onclick="deleteMatch('${m.id}')">🗑️</button>
            </div>
            <div class="card-title">🔪 ${killerImgHtml} ${escapeHtml(m.killer)}</div>
            <div class="card-sub">🗺️ ${mapImgHtml} ${escapeHtml(m.map)}</div>
            <div class="card-details">
              ${m.survivor ? `<span>👤 ${survImgHtml} <b>${escapeHtml(m.survivor)}</b></span>` : ''}
              <span>⚡ Gen: <b>${m.gens}/5</b></span>
              <span>Résultat: <b>${statusText}</b></span>
            </div>
            ${m.perks && m.perks.length > 0 ? `<div class="card-perks-list">${m.perks.map(p => {
              const pImg = savedImages[`${perkPrefix}_${p}`];
              const pImgHtml = pImg ? `<img src="${pImg}" class="img-thumb square">` : '';
              return `<span class="card-perk-tag">${pImgHtml}${escapeHtml(p)}</span>`;
            }).join('')}</div>` : ''}
          `;
        } else {
          // Killer Match Card
          card.style.borderLeftColor = m.kills === '4' ? 'var(--accent-red)' : m.kills === '3' ? 'var(--accent-orange)' : 'var(--accent-blue)';
          
          card.innerHTML = `
            <div class="card-actions">
              <button class="btn-icon" onclick="openMatchModal('${m.id}')">✏️</button>
              <button class="btn-icon" onclick="deleteMatch('${m.id}')">🗑️</button>
            </div>
            <div class="card-title">🔪 ${killerImgHtml} ${escapeHtml(m.killer)}</div>
            <div class="card-sub">🗺️ ${mapImgHtml} ${escapeHtml(m.map)}</div>
            <div class="card-details">
              <span>☠️ Kills: <b style="color:var(--accent-red);">${m.kills}K</b></span>
              <span>⚡ Gens faits: <b>${m.gens}/5</b></span>
              <span>🏃 Échappés: <b>${m.escaped}</b></span>
            </div>
            ${m.perks && m.perks.length > 0 ? `<div class="card-perks-list">${m.perks.map(p => {
              const pImg = savedImages[`${perkPrefix}_${p}`];
              const pImgHtml = pImg ? `<img src="${pImg}" class="img-thumb square">` : '';
              return `<span class="card-perk-tag">${pImgHtml}${escapeHtml(p)}</span>`;
            }).join('')}</div>` : ''}
          `;
        }

        container.appendChild(card);
      });
    }

    // Render Random View
    function renderRandom() {
      const container = document.getElementById('view-random');
      const isSurv = currentRole === 'survivor';

      container.innerHTML = `
        <div style="background:var(--card-bg); border:1px solid var(--border-color); border-radius:10px; padding:16px; text-align:center;">
          <h3 style="margin-bottom:12px; font-size:1.1rem;">🎲 Tirage Aléatoire ${isSurv ? 'Survivant' : 'Tueur'}</h3>
          <button class="btn-main" style="background:${isSurv ? 'var(--accent-blue)' : 'var(--accent-red)'}; margin-bottom:14px;" onclick="runRandomizer()">🚀 Tirer un Build Aléatoire</button>
          <div id="random-result"></div>
        </div>
      `;
    }

    function runRandomizer() {
      const resDiv = document.getElementById('random-result');
      const isSurv = currentRole === 'survivor';
      const charList = isSurv ? savedSurvivors : savedKillers;
      const perkList = isSurv ? savedPerksSurv : savedPerksKiller;
      const perkPrefix = isSurv ? 'perks_surv' : 'perks_killer';

      if (charList.length === 0) {
        resDiv.innerHTML = `<div style="color:var(--accent-red); font-size:0.85rem;">Aucun ${isSurv ? 'survivant' : 'tueur'} enregistré dans vos listes !</div>`;
        return;
      }

      const randomChar = charList[Math.floor(Math.random() * charList.length)];
      const charImgKey = isSurv ? `survivors_${randomChar}` : `killers_${randomChar}`;
      const charImg = savedImages[charImgKey];
      const charImgHtml = charImg ? `<img src="${charImg}" class="img-thumb large">` : '';

      const shuffledPerks = [...perkList].sort(() => 0.5 - Math.random());
      const selectedPerks = shuffledPerks.slice(0, 4);

      let perksHtml = selectedPerks.length === 0 ? '<div style="color:var(--text-muted); grid-column:1/-1;">Aucune perk dans la liste.</div>' :
        selectedPerks.map(p => {
          const pImg = savedImages[`${perkPrefix}_${p}`];
          const pImgHtml = pImg ? `<img src="${pImg}" class="img-thumb square">` : '';
          return `<div class="card-perk-tag" style="padding:6px; font-size:0.8rem;">${pImgHtml}<span>${escapeHtml(p)}</span></div>`;
        }).join('');

      resDiv.innerHTML = `
        <div style="background:#0b0b0e; padding:10px; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:12px;">
          ${charImgHtml}
          <span style="font-weight:bold; font-size:1.1rem;">${isSurv ? '👤' : '🔪'} ${escapeHtml(randomChar)}</span>
        </div>
        <div style="font-size:0.75rem; text-transform:uppercase; color:var(--text-muted); text-align:left; font-weight:bold; margin-bottom:6px;">Perks Tirées :</div>
        <div class="perks-grid">
          ${perksHtml}
        </div>
      `;
    }

    // Render Stats View
    function renderStats() {
      const container = document.getElementById('view-stats');
      const roleMatches = matches.filter(m => m.role === currentRole);
      const total = roleMatches.length;

      if (total === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:30px;">Aucune partie enregistrée dans ce mode.</div>';
        return;
      }

      if (currentRole === 'survivor') {
        const green = roleMatches.filter(m => m.outcome === 'green').length;
        const orange = roleMatches.filter(m => m.outcome === 'orange').length;
        const red = roleMatches.filter(m => m.outcome === 'red').length;
        const escapeRate = (((green + orange) / total) * 100).toFixed(1);

        container.innerHTML = `
          <div class="stats-grid">
            <div class="stat-box"><div class="stat-lbl">Parties</div><div class="stat-val" style="color:var(--accent-blue);">${total}</div></div>
            <div class="stat-box"><div class="stat-lbl">Survie</div><div class="stat-val" style="color:var(--accent-green);">${escapeRate}%</div></div>
            <div class="stat-box"><div class="stat-lbl">🟢 Porte</div><div class="stat-val">${green}</div></div>
            <div class="stat-box"><div class="stat-lbl">🔴 Mort</div><div class="stat-val" style="color:var(--accent-red);">${red}</div></div>
          </div>
        `;
      } else {
        const totalKills = roleMatches.reduce((acc, m) => acc + parseInt(m.kills), 0);
        const avgKills = (totalKills / total).toFixed(1);
        const k4 = roleMatches.filter(m => m.kills === '4').length;

        container.innerHTML = `
          <div class="stats-grid">
            <div class="stat-box"><div class="stat-lbl">Parties Jouées</div><div class="stat-val" style="color:var(--accent-blue);">${total}</div></div>
            <div class="stat-box"><div class="stat-lbl">Moyenne Kills</div><div class="stat-val" style="color:var(--accent-red);">${avgKills} / 4</div></div>
            <div class="stat-box"><div class="stat-lbl">Total Kills</div><div class="stat-val">${totalKills}</div></div>
            <div class="stat-box"><div class="stat-lbl">4K Perfects</div><div class="stat-val" style="color:var(--accent-green);">${k4}</div></div>
          </div>
        `;
      }
    }

    // Render Settings & Lists View
    let activeSettingCategory = 'survivors';

    function renderSettings() {
      const container = document.getElementById('view-settings');
      container.innerHTML = `
        <div style="background:var(--card-bg); border:1px solid var(--border-color); border-radius:8px; padding:12px; margin-bottom:12px;">
          <h4 style="margin-bottom:8px; font-size:0.9rem;">🖼️ Gestion des Éléments & Photos</h4>
          <div class="filter-bar" style="margin-bottom:10px;">
            <button class="sub-filter-btn ${activeSettingCategory==='survivors'?'active':''}" onclick="setSettingCategory('survivors')">👤 Survs</button>
            <button class="sub-filter-btn ${activeSettingCategory==='killers'?'active':''}" onclick="setSettingCategory('killers')">🔪 Tueurs</button>
            <button class="sub-filter-btn ${activeSettingCategory==='maps'?'active':''}" onclick="setSettingCategory('maps')">🗺️ Maps</button>
            <button class="sub-filter-btn ${activeSettingCategory==='perks_surv'?'active':''}" onclick="setSettingCategory('perks_surv')">⚡ Perks Surv</button>
            <button class="sub-filter-btn ${activeSettingCategory==='perks_killer'?'active':''}" onclick="setSettingCategory('perks_killer')">⚡ Perks Tueur</button>
          </div>

          <div style="display:flex; gap:6px; margin-bottom:10px;">
            <input type="text" id="manual-add-item" placeholder="Ajouter au catalogue..." style="flex:1; padding:8px; background:#0b0b0e; border:1px solid var(--border-color); color:#fff; border-radius:4px; font-size:14px;">
            <button onclick="addManualItem()" style="background:var(--accent-green); color:white; border:none; padding:8px 12px; border-radius:4px; font-weight:bold;">+</button>
          </div>

          <ul class="saved-list" id="settings-items-list"></ul>
        </div>
      `;

      renderSettingsItemsList();
    }

    function setSettingCategory(cat) {
      activeSettingCategory = cat;
      renderSettings();
    }

    function getListByCat(cat) {
      if (cat === 'survivors') return savedSurvivors;
      if (cat === 'killers') return savedKillers;
      if (cat === 'maps') return savedMaps;
      if (cat === 'perks_surv') return savedPerksSurv;
      if (cat === 'perks_killer') return savedPerksKiller;
      return [];
    }

    function renderSettingsItemsList() {
      const listEl = document.getElementById('settings-items-list');
      const list = getListByCat(activeSettingCategory);
      listEl.innerHTML = '';

      if (list.length === 0) {
        listEl.innerHTML = '<li style="color:var(--text-muted); font-size:0.8rem; padding:6px;">Aucun élément enregistré.</li>';
        return;
      }

      list.sort().forEach(item => {
        const li = document.createElement('li');
        li.className = 'saved-item';
        const imgKey = `${activeSettingCategory}_${item}`;
        const imgSrc = savedImages[imgKey];
        const imgHtml = imgSrc ? `<img src="${imgSrc}" class="img-thumb ${activeSettingCategory.includes('perks')||activeSettingCategory==='maps'?'square':''}"> ` : '';

        li.innerHTML = `
          <div style="display:flex; align-items:center; gap:8px;">
            ${imgHtml}
            <span>${escapeHtml(item)}</span>
          </div>
          <div style="display:flex; gap:6px;">
            <label style="background:var(--accent-blue); color:white; padding:2px 6px; border-radius:4px; font-size:0.75rem; cursor:pointer;">
              📷 <input type="file" accept="image/*" style="display:none;" onchange="uploadImageForItem('${escapeHtml(item)}', event)">
            </label>
            <button onclick="removeItem('${escapeHtml(item)}')" style="background:var(--accent-red); color:white; border:none; padding:2px 6px; border-radius:4px; cursor:pointer;">✕</button>
          </div>
        `;
        listEl.appendChild(li);
      });
    }

    function addManualItem() {
      const val = document.getElementById('manual-add-item').value.trim();
      if (!val) return;
      const list = getListByCat(activeSettingCategory);
      if (!list.includes(val)) {
        list.push(val);
        saveListByCat(activeSettingCategory);
        renderSettingsItemsList();
      }
      document.getElementById('manual-add-item').value = '';
    }

    function removeItem(item) {
      const list = getListByCat(activeSettingCategory);
      const idx = list.indexOf(item);
      if (idx !== -1) {
        list.splice(idx, 1);
        delete savedImages[`${activeSettingCategory}_${item}`];
        localStorage.setItem('dbd_v4_images', JSON.stringify(savedImages));
        saveListByCat(activeSettingCategory);
        renderSettingsItemsList();
      }
    }

    function uploadImageForItem(item, event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 120;
          let width = img.width, height = img.height;

          if (width > height) { if (width > maxDim) { height *= maxDim / width; width = maxDim; } }
          else { if (height > maxDim) { width *= maxDim / height; width = maxDim; } }

          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          savedImages[`${activeSettingCategory}_${item}`] = canvas.toDataURL('image/jpeg', 0.85);
          localStorage.setItem('dbd_v4_images', JSON.stringify(savedImages));
          renderSettingsItemsList();
        };
      };
      reader.readAsDataURL(file);
    }

    function saveListByCat(cat) {
      if (cat === 'survivors') localStorage.setItem('dbd_v4_survivors', JSON.stringify(savedSurvivors));
      if (cat === 'killers') localStorage.setItem('dbd_v4_killers', JSON.stringify(savedKillers));
      if (cat === 'maps') localStorage.setItem('dbd_v4_maps', JSON.stringify(savedMaps));
      if (cat === 'perks_surv') localStorage.setItem('dbd_v4_perks_surv', JSON.stringify(savedPerksSurv));
      if (cat === 'perks_killer') localStorage.setItem('dbd_v4_perks_killer', JSON.stringify(savedPerksKiller));
    }

    function escapeHtml(str) {
      return str ? str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])) : '';
    }

    // Init
    setupSubFilterBar();
    render();
  </script>
</body>
</html>
