<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBD Match Tracker V2</title>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #141418;
      --card-header: #1c1c22;
      --accent-red: #d92b2b;
      --accent-orange: #e67e22;
      --accent-green: #2ecc71;
      --text-color: #e0e0e0;
      --text-muted: #8e8e99;
      --border-color: #262630;
      --perk-bg: #1e1e26;
      --perk-border: #3a3a4a;
      --perk-accent: #8e44ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Trebuchet MS', 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 15px;
      max-width: 800px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      font-size: 1.8rem;
      text-shadow: 0 0 12px rgba(217, 43, 43, 0.6);
    }

    /* Streak Bar */
    .streak-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 15px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .streak-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      text-transform: uppercase;
      font-weight: bold;
    }

    .streak-dots {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0;
    }

    .streak-dot {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: white;
      flex-shrink: 0;
    }
    .streak-dot.green { background: var(--accent-green); }
    .streak-dot.orange { background: var(--accent-orange); }
    .streak-dot.red { background: var(--accent-red); }

    /* Controls Bar (Export / Import / Search) */
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 180px;
      padding: 10px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      font-size: 0.9rem;
    }

    .btn-tool {
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s;
    }

    .btn-tool:hover {
      background: #202028;
    }

    /* Main Button */
    .btn-main {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--accent-red);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(217, 43, 43, 0.3);
      transition: transform 0.1s, background 0.2s;
    }

    .btn-main:active {
      transform: scale(0.99);
    }

    .btn-main:hover {
      background: #b52222;
    }

    /* Modal Form */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.88);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      background: #0b0b0e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      font-size: 0.95rem;
    }

    .form-group textarea {
      resize: vertical;
      height: 60px;
    }

    /* Perks 4 Diamonds / Squares Grid */
    .perks-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 5px;
    }

    .perk-box {
      background: var(--perk-bg);
      border: 1px dashed var(--perk-border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      transition: border-color 0.2s;
    }

    .perk-box:focus-within {
      border-color: var(--perk-accent);
    }

    .perk-label {
      font-size: 0.7rem;
      color: var(--perk-accent);
      font-weight: bold;
      text-transform: uppercase;
    }

    .perk-input {
      background: transparent !important;
      border: none !important;
      padding: 4px 0 !important;
      font-size: 0.85rem !important;
      color: #fff !important;
    }

    .radio-group {
      display: flex;
      gap: 8px;
      margin-top: 5px;
    }

    .radio-option {
      flex: 1;
      text-align: center;
    }

    .radio-option input {
      display: none;
    }

    .radio-option label {
      display: block;
      padding: 10px 5px;
      background: #0b0b0e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-color);
      font-weight: bold;
    }

    .radio-option input:checked + label.lbl-red { background: var(--accent-red); color: white; border-color: var(--accent-red); }
    .radio-option input:checked + label.lbl-orange { background: var(--accent-orange); color: white; border-color: var(--accent-orange); }
    .radio-option input:checked + label.lbl-green { background: var(--accent-green); color: white; border-color: var(--accent-green); }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-secondary {
      background: #2a2a35;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
    }

    /* Tabs Bar */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 15px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      padding: 8px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tab-badge {
      background: #262630;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 0.75rem;
      color: #fff;
    }

    .tab-btn.active {
      background: #22222c;
      color: white;
      border-color: #555;
    }

    /* Match Card Lists */
    .match-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 14px;
      border-left: 5px solid var(--border-color);
      position: relative;
    }

    .match-card.status-red { border-left-color: var(--accent-red); }
    .match-card.status-orange { border-left-color: var(--accent-orange); }
    .match-card.status-green { border-left-color: var(--accent-green); }

    .card-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-icon:hover { color: white; }

    .card-header {
      margin-bottom: 6px;
      padding-right: 50px;
    }

    .card-killer {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
    }

    .card-map {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .card-details {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.85rem;
      margin: 8px 0;
      color: #ccc;
      background: #0b0b0e;
      padding: 8px;
      border-radius: 6px;
    }

    .card-perks-title {
      font-size: 0.75rem;
      color: var(--perk-accent);
      text-transform: uppercase;
      font-weight: bold;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    .card-perks-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .card-perk-tag {
      background: var(--perk-bg);
      border: 1px solid var(--perk-border);
      color: #d1c4e9;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .card-notes {
      font-size: 0.8rem;
      background: #0b0b0e;
      padding: 8px;
      border-radius: 4px;
      color: #aaa;
      margin-top: 8px;
      border-left: 2px solid #3a3a4a;
    }

    /* Stats View */
    .stats-container {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .stats-container.active {
      display: flex;
    }

    .stat-box {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .stat-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: bold;
      color: white;
    }

    .stat-list {
      list-style: none;
      margin-top: 8px;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #1a1a22;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h1>DBD Match Tracker</h1>

  <!-- Top Streak Bar -->
  <div class="streak-container">
    <span class="streak-title">Derniers Matchs:</span>
    <div class="streak-dots" id="streak-dots">
      <span style="color:var(--text-muted); font-size:0.8rem;">Aucune partie</span>
    </div>
  </div>

  <!-- Action Bar (Search + Export/Import) -->
  <div class="toolbar">
    <input type="text" id="search-bar" class="search-input" placeholder="🔍 Rechercher (Tueur, Map, Perk...)" oninput="render()">
    <button class="btn-tool" onclick="exportData()">💾 Exporter</button>
    <button class="btn-tool" onclick="document.getElementById('import-file').click()">📂 Importer</button>
    <input type="file" id="import-file" style="display:none" accept=".json" onchange="importData(event)">
  </div>

  <button class="btn-main" onclick="openModal()">+ Ajouter une partie</button>

  <!-- Navigation Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('all', event)">
      Tous <span class="tab-badge" id="count-all">0</span>
    </button>
    <button class="tab-btn" onclick="switchTab('green', event)">
      🟢 Porte <span class="tab-badge" id="count-green">0</span>
    </button>
    <button class="tab-btn" onclick="switchTab('orange', event)">
      🟠 Trappe <span class="tab-badge" id="count-orange">0</span>
    </button>
    <button class="tab-btn" onclick="switchTab('red', event)">
      🔴 Non sorti <span class="tab-badge" id="count-red">0</span>
    </button>
    <button class="tab-btn" onclick="switchTab('stats', event)">📊 Stats</button>
  </div>

  <!-- Match Cards List -->
  <div id="match-list" class="match-list"></div>

  <!-- Stats View -->
  <div id="stats-view" class="stats-container">
    <div class="stat-box">
      <div class="stat-title">Taux de Survie Global</div>
      <div class="stat-value" id="stat-survival">0%</div>
    </div>
    <div class="stat-box">
      <div class="stat-title">Tueur le Plus Mortel</div>
      <div class="stat-value" id="stat-deadliest">-</div>
    </div>
    <div class="stat-box">
      <div class="stat-title">Taux d'Apparition des Tueurs</div>
      <ul class="stat-list" id="stat-killers"></ul>
    </div>
  </div>

  <!-- Form Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modal-title" style="margin-bottom: 12px; font-size:1.3rem;">Nouvelle Partie</h2>
      <form id="match-form">
        <input type="hidden" id="match-id">
        
        <div class="form-group">
          <label for="killer">Tueur</label>
          <input type="text" id="killer" required placeholder="Ex: Ghostface, Nurse...">
        </div>

        <div class="form-group">
          <label for="map">Map (Texte libre)</label>
          <input type="text" id="map" placeholder="Ex: Ormond, RPD...">
        </div>

        <div style="display:flex; gap:10px;">
          <div class="form-group" style="flex:1;">
            <label for="gens">Générateurs</label>
            <input type="number" id="gens" min="0" max="5" value="5">
          </div>
          <div class="form-group" style="flex:1;">
            <label for="escaped">Évadés (0 à 4)</label>
            <input type="number" id="escaped" min="0" max="4" value="1" oninput="autoCheckStatus()">
          </div>
        </div>

        <!-- Hooks Count -->
        <div class="form-group">
          <label for="hooks">Fois accroché</label>
          <select id="hooks">
            <option value="0">0 fois (Jamais accroché)</option>
            <option value="1">1 fois</option>
            <option value="2">2 fois (Près de la mort)</option>
          </select>
        </div>

        <!-- Perks Section (4 Squares) -->
        <div class="form-group">
          <label>Tes Perks (4 Emplacements)</label>
          <div class="perks-grid">
            <div class="perk-box">
              <span class="perk-label">Perk 1</span>
              <input type="text" id="perk1" class="perk-input" list="perks-saved-list" placeholder="Nom de la perk...">
            </div>
            <div class="perk-box">
              <span class="perk-label">Perk 2</span>
              <input type="text" id="perk2" class="perk-input" list="perks-saved-list" placeholder="Nom de la perk...">
            </div>
            <div class="perk-box">
              <span class="perk-label">Perk 3</span>
              <input type="text" id="perk3" class="perk-input" list="perks-saved-list" placeholder="Nom de la perk...">
            </div>
            <div class="perk-box">
              <span class="perk-label">Perk 4</span>
              <input type="text" id="perk4" class="perk-input" list="perks-saved-list" placeholder="Nom de la perk...">
            </div>
          </div>
          <datalist id="perks-saved-list"></datalist>
        </div>

        <div class="form-group">
          <label>Résultat de ta partie</label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="out-red" name="status" value="red" checked>
              <label for="out-red" class="lbl-red">Mort 🔴</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="out-orange" name="status" value="orange">
              <label for="out-orange" class="lbl-orange">Trappe 🟠</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="out-green" name="status" value="green">
              <label for="out-green" class="lbl-green">Porte 🟢</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="notes">Notes / Remarques (Optionnel)</label>
          <textarea id="notes" placeholder="Ex: Tunnel, clutch trappe..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeModal()">Annuler</button>
          <button type="submit" class="btn-main" style="margin:0; flex:1;">Terminé</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Audio Web API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'green') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'orange') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(349.23, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'red') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      }
    }

    // Local Storage Data
    let matches = JSON.parse(localStorage.getItem('dbd_matches')) || [];
    let savedPerks = JSON.parse(localStorage.getItem('dbd_saved_perks')) || [];
    let currentTab = 'all';

    const modal = document.getElementById('modal');
    const form = document.getElementById('match-form');

    function updateSavedPerksDatalist() {
      const datalist = document.getElementById('perks-saved-list');
      datalist.innerHTML = '';
      savedPerks.sort().forEach(perk => {
        const option = document.createElement('option');
        option.value = perk;
        datalist.appendChild(option);
      });
    }

    function autoCheckStatus() {
      const escaped = parseInt(document.getElementById('escaped').value) || 0;
      if (escaped === 0) {
        document.getElementById('out-red').checked = true;
      }
    }

    function openModal(editId = null) {
      form.reset();
      document.getElementById('match-id').value = '';
      document.getElementById('modal-title').innerText = "Nouvelle Partie";
      updateSavedPerksDatalist();

      if (editId) {
        const match = matches.find(m => m.id === editId);
        if (match) {
          document.getElementById('match-id').value = match.id;
          document.getElementById('killer').value = match.killer;
          document.getElementById('map').value = match.map;
          document.getElementById('gens').value = match.gens;
          document.getElementById('escaped').value = match.escaped;
          document.getElementById('hooks').value = match.hooks !== undefined ? match.hooks : 0;
          document.getElementById('notes').value = match.notes;
          document.querySelector(`input[name="status"][value="${match.status}"]`).checked = true;
          
          const perks = match.perks || [];
          document.getElementById('perk1').value = perks[0] || '';
          document.getElementById('perk2').value = perks[1] || '';
          document.getElementById('perk3').value = perks[2] || '';
          document.getElementById('perk4').value = perks[3] || '';

          document.getElementById('modal-title').innerText = "Modifier la Partie";
        }
      }

      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const id = document.getElementById('match-id').value;
      const rawKiller = document.getElementById('killer').value.trim();
      const killer = rawKiller.charAt(0).toUpperCase() + rawKiller.slice(1);
      const map = document.getElementById('map').value.trim() || 'Map non spécifiée';
      const gens = document.getElementById('gens').value;
      const status = document.querySelector('input[name="status"]:checked').value;
      const escaped = document.getElementById('escaped').value;
      const hooks = document.getElementById('hooks').value;
      const notes = document.getElementById('notes').value.trim();

      // Collect Perks
      const p1 = document.getElementById('perk1').value.trim();
      const p2 = document.getElementById('perk2').value.trim();
      const p3 = document.getElementById('perk3').value.trim();
      const p4 = document.getElementById('perk4').value.trim();
      const perks = [p1, p2, p3, p4].filter(p => p !== '');

      // Save new perks into history
      perks.forEach(p => {
        if (!savedPerks.includes(p)) {
          savedPerks.push(p);
        }
      });
      localStorage.setItem('dbd_saved_perks', JSON.stringify(savedPerks));

      if (id) {
        const index = matches.findIndex(m => m.id === id);
        if (index !== -1) {
          matches[index] = { id, killer, map, gens, status, escaped, hooks, perks, notes, date: matches[index].date };
        }
      } else {
        const newMatch = {
          id: Date.now().toString(),
          killer,
          map,
          gens,
          status,
          escaped,
          hooks,
          perks,
          notes,
          date: new Date().toLocaleDateString('fr-FR')
        };
        matches.unshift(newMatch);
        playSound(status);
      }

      saveData();
      closeModal();
      render();
    });

    function deleteMatch(id) {
      if (confirm('Supprimer ce bloc ?')) {
        matches = matches.filter(m => m.id !== id);
        saveData();
        render();
      }
    }

    function saveData() {
      localStorage.setItem('dbd_matches', JSON.stringify(matches));
    }

    function switchTab(tab, event) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (event && event.currentTarget) {
        event.currentTarget.classList.add('active');
      }
      render();
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ matches, savedPerks }));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `dbd_tracker_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.matches && Array.isArray(parsed.matches)) {
            matches = parsed.matches;
            if (parsed.savedPerks) savedPerks = parsed.savedPerks;
            saveData();
            localStorage.setItem('dbd_saved_perks', JSON.stringify(savedPerks));
            render();
            alert('Importation réussie !');
          } else {
            alert('Fichier invalide.');
          }
        } catch (err) {
          alert('Erreur lors de la lecture du fichier.');
        }
      };
      reader.readAsText(file);
    }

    function renderStreak() {
      const streakContainer = document.getElementById('streak-dots');
      streakContainer.innerHTML = '';
      
      const lastMatches = matches.slice(0, 10);
      if (lastMatches.length === 0) {
        streakContainer.innerHTML = `<span style="color:var(--text-muted); font-size:0.8rem;">Aucune partie</span>`;
        return;
      }

      lastMatches.forEach(m => {
        const dot = document.createElement('div');
        dot.className = `streak-dot ${m.status}`;
        dot.innerText = m.status === 'green' ? '✓' : (m.status === 'orange' ? '★' : '✕');
        dot.title = `${m.killer} - ${m.map}`;
        streakContainer.appendChild(dot);
      });
    }

    function updateTabCounts() {
      document.getElementById('count-all').innerText = matches.length;
      document.getElementById('count-green').innerText = matches.filter(m => m.status === 'green').length;
      document.getElementById('count-orange').innerText = matches.filter(m => m.status === 'orange').length;
      document.getElementById('count-red').innerText = matches.filter(m => m.status === 'red').length;
    }

    function render() {
      renderStreak();
      updateTabCounts();

      const listContainer = document.getElementById('match-list');
      const statsView = document.getElementById('stats-view');
      const searchVal = document.getElementById('search-bar').value.toLowerCase().trim();

      if (currentTab === 'stats') {
        listContainer.style.display = 'none';
        statsView.classList.add('active');
        calculateStats();
        return;
      }

      listContainer.style.display = 'flex';
      statsView.classList.remove('active');
      listContainer.innerHTML = '';

      const filtered = matches.filter(m => {
        if (currentTab !== 'all' && m.status !== currentTab) return false;
        
        if (searchVal) {
          const matchKiller = m.killer.toLowerCase().includes(searchVal);
          const matchMap = m.map.toLowerCase().includes(searchVal);
          const matchNotes = (m.notes || '').toLowerCase().includes(searchVal);
          const matchPerks = (m.perks || []).some(p => p.toLowerCase().includes(searchVal));
          return matchKiller || matchMap || matchNotes || matchPerks;
        }

        return true;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = `<p style="text-align:center; color:var(--text-muted); margin-top:20px;">Aucune partie ne correspond.</p>`;
        return;
      }

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = `match-card status-${m.status}`;
        
        const perksHtml = (m.perks && m.perks.length > 0) ? `
          <div class="card-perks-title">Perks équipées</div>
          <div class="card-perks-list">
            ${m.perks.map(p => `<span class="card-perk-tag">💎 ${escapeHtml(p)}</span>`).join('')}
          </div>
        ` : '';

        const hooksText = m.hooks == 0 ? "0 fois 🛡️" : `${m.hooks} fois 🪝`;

        card.innerHTML = `
          <div class="card-actions">
            <button class="btn-icon" onclick="openModal('${m.id}')">✏️</button>
            <button class="btn-icon" onclick="deleteMatch('${m.id}')">🗑️</button>
          </div>
          <div class="card-header">
            <div class="card-killer">🔪 ${escapeHtml(m.killer)}</div>
            <div class="card-map">📍 ${escapeHtml(m.map)} — <small>${m.date}</small></div>
          </div>
          <div class="card-details">
            <span>⚙️ Gens: <b>${m.gens}/5</b></span>
            <span>🏃 Sortis: <b>${m.escaped}/4</b></span>
            <span>🪝 Accroché: <b>${hooksText}</b></span>
          </div>
          ${perksHtml}
          ${m.notes ? `<div class="card-notes">${escapeHtml(m.notes)}</div>` : ''}
        `;
        listContainer.appendChild(card);
      });
    }

    function calculateStats() {
      const total = matches.length;
      if (total === 0) {
        document.getElementById('stat-survival').innerText = '0%';
        document.getElementById('stat-deadliest').innerText = '-';
        document.getElementById('stat-killers').innerHTML = '<li>Aucune donnée enregistrée</li>';
        return;
      }

      const escapes = matches.filter(m => m.status === 'green' || m.status === 'orange').length;
      const survivalRate = Math.round((escapes / total) * 100);
      document.getElementById('stat-survival').innerText = `${survivalRate}% (${escapes}/${total})`;

      const killerApperances = {};
      const killerDeaths = {};

      matches.forEach(m => {
        const k = m.killer;
        killerApperances[k] = (killerApperances[k] || 0) + 1;
        if (m.status === 'red') {
          killerDeaths[k] = (killerDeaths[k] || 0) + 1;
        }
      });

      let deadliestKiller = '-';
      let maxDeathRate = -1;

      Object.keys(killerApperances).forEach(k => {
        const deaths = killerDeaths[k] || 0;
        const rate = deaths / killerApperances[k];
        if (rate > maxDeathRate) {
          maxDeathRate = rate;
          deadliestKiller = k;
        }
      });

      const deadliestPercent = Math.round((maxDeathRate) * 100);
      document.getElementById('stat-deadliest').innerText = `${deadliestKiller} (${deadliestPercent}% de mort)`;

      const killerList = document.getElementById('stat-killers');
      killerList.innerHTML = '';

      const sortedKillers = Object.keys(killerApperances).sort((a,b) => killerApperances[b] - killerApperances[a]);

      sortedKillers.forEach(k => {
        const count = killerApperances[k];
        const percent = Math.round((count / total) * 100);
        
        const li = document.createElement('li');
        li.className = 'stat-item';
        li.innerHTML = `<span>🔪 ${escapeHtml(k)}</span> <b>${percent}% (${count} game${count > 1 ? 's' : ''})</b>`;
        killerList.appendChild(li);
      });
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    render();
  </script>
</body>
</html>
