<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBD Match Tracker</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #18181c;
      --accent-red: #d92b2b;
      --accent-orange: #e67e22;
      --accent-green: #2ecc71;
      --text-color: #e0e0e0;
      --text-muted: #a0a0a0;
      --border-color: #2a2a30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 10px rgba(217, 43, 43, 0.5);
    }

    /* Formulaire & Modale */
    .btn-main {
      display: block;
      width: 100%;
      padding: 15px;
      background: var(--accent-red);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.2s;
    }

    .btn-main:hover {
      background: #b52222;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      background: #0f0f12;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      font-size: 1rem;
    }

    .form-group textarea {
      resize: vertical;
      height: 70px;
    }

    .radio-group {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .radio-option {
      flex: 1;
      text-align: center;
    }

    .radio-option input {
      display: none;
    }

    .radio-option label {
      display: block;
      padding: 10px;
      background: #0f0f12;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-color);
    }

    .radio-option input:checked + label.lbl-red { background: var(--accent-red); color: white; border-color: var(--accent-red); }
    .radio-option input:checked + label.lbl-orange { background: var(--accent-orange); color: white; border-color: var(--accent-orange); }
    .radio-option input:checked + label.lbl-green { background: var(--accent-green); color: white; border-color: var(--accent-green); }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-secondary {
      background: #3a3a40;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
    }

    /* Navigation Onglets */
    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .tab-btn {
      padding: 10px 15px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: #2a2a35;
      color: white;
      border-color: #555;
    }

    /* Cartes / Blocs */
    .match-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 15px;
      border-left: 6px solid var(--border-color);
      position: relative;
    }

    .match-card.status-red { border-left-color: var(--accent-red); }
    .match-card.status-orange { border-left-color: var(--accent-orange); }
    .match-card.status-green { border-left-color: var(--accent-green); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .card-killer {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .card-map {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .card-details {
      display: flex;
      gap: 15px;
      font-size: 0.9rem;
      margin-bottom: 10px;
      color: #ccc;
    }

    .card-notes {
      font-size: 0.85rem;
      background: #0f0f12;
      padding: 8px;
      border-radius: 4px;
      color: #bbb;
    }

    .card-actions {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-icon:hover { color: white; }

    /* Vue Statistiques */
    .stats-container {
      display: none;
      flex-direction: column;
      gap: 15px;
    }

    .stats-container.active {
      display: flex;
    }

    .stat-box {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .stat-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: white;
    }

    .stat-list {
      list-style: none;
      margin-top: 10px;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #222;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <h1>DBD Match Tracker</h1>

  <button class="btn-main" onclick="openModal()">+ Ajouter une partie</button>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('all')">Tous</button>
    <button class="tab-btn" onclick="switchTab('green')">🟢 Porte</button>
    <button class="tab-btn" onclick="switchTab('orange')">🟠 Trappe</button>
    <button class="tab-btn" onclick="switchTab('red')">🔴 Non sorti</button>
    <button class="tab-btn" onclick="switchTab('stats')">📊 Stats</button>
  </div>

  <div id="match-list" class="match-list"></div>

  <div id="stats-view" class="stats-container">
    <div class="stat-box">
      <div class="stat-title">Taux de Survie Global</div>
      <div class="stat-value" id="stat-survival">0%</div>
    </div>
    <div class="stat-box">
      <div class="stat-title">Tueur le Plus Mortel</div>
      <div class="stat-value" id="stat-deadliest">-</div>
    </div>
    <div class="stat-box">
      <div class="stat-title">Taux d'Apparition des Tueurs</div>
      <ul class="stat-list" id="stat-killers"></ul>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modal-title" style="margin-bottom: 15px;">Nouvelle Partie</h2>
      <form id="match-form">
        <input type="hidden" id="match-id">
        
        <div class="form-group">
          <label for="killer">Tueur</label>
          <input type="text" id="killer" required placeholder="Ex: Ghostface, Nurse...">
        </div>

        <div class="form-group">
          <label for="map">Map (Texte libre)</label>
          <input type="text" id="map" placeholder="Ex: Ormond, RPD...">
        </div>

        <div class="form-group">
          <label for="gens">Générateurs réparés</label>
          <input type="number" id="gens" min="0" max="5" value="5">
        </div>

        <div class="form-group">
          <label>Résultat de ta partie</label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="out-red" name="status" value="red" checked>
              <label for="out-red" class="lbl-red">Mort 🔴</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="out-orange" name="status" value="orange">
              <label for="out-orange" class="lbl-orange">Trappe 🟠</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="out-green" name="status" value="green">
              <label for="out-green" class="lbl-green">Porte 🟢</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="survivors-escaped">Nombre de survivants évadés au total (0 à 4)</label>
          <input type="number" id="survivors-escaped" min="0" max="4" value="1">
        </div>

        <div class="form-group">
          <label for="notes">Notes / Remarques (Optionnel)</label>
          <textarea id="notes" placeholder="Ex: Tunnel en début de game, clutch trappe..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeModal()">Annuler</button>
          <button type="submit" class="btn-main" style="margin:0; flex:1;">Terminé</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Audio Web API pour générer des effets sonores sans fichiers externes
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'green') {
        // Son aigu de succès (Porte)
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.3); // E5
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'orange') {
        // Son intermédiaire (Trappe)
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(349.23, audioCtx.currentTime); // F4
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.3); // A4
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'red') {
        // Son grave de défaite (Mort)
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      }
    }

    // Gestion des données dans LocalStorage
    let matches = JSON.parse(localStorage.getItem('dbd_matches')) || [];
    let currentTab = 'all';

    const modal = document.getElementById('modal');
    const form = document.getElementById('match-form');

    function openModal(editId = null) {
      form.reset();
      document.getElementById('match-id').value = '';
      document.getElementById('modal-title').innerText = "Nouvelle Partie";

      if (editId) {
        const match = matches.find(m => m.id === editId);
        if (match) {
          document.getElementById('match-id').value = match.id;
          document.getElementById('killer').value = match.killer;
          document.getElementById('map').value = match.map;
          document.getElementById('gens').value = match.gens;
          document.getElementById('survivors-escaped').value = match.escaped;
          document.getElementById('notes').value = match.notes;
          document.querySelector(`input[name="status"][value="${match.status}"]`).checked = true;
          document.getElementById('modal-title').innerText = "Modifier la Partie";
        }
      }

      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const id = document.getElementById('match-id').value;
      const killer = document.getElementById('killer').value.trim();
      const map = document.getElementById('map').value.trim() || 'Map non spécifiée';
      const gens = document.getElementById('gens').value;
      const status = document.querySelector('input[name="status"]:checked').value;
      const escaped = document.getElementById('survivors-escaped').value;
      const notes = document.getElementById('notes').value.trim();

      if (id) {
        // Modification
        const index = matches.findIndex(m => m.id === id);
        if (index !== -1) {
          matches[index] = { id, killer, map, gens, status, escaped, notes, date: matches[index].date };
        }
      } else {
        // Création
        const newMatch = {
          id: Date.now().toString(),
          killer,
          map,
          gens,
          status,
          escaped,
          notes,
          date: new Date().toLocaleDateString('fr-FR')
        };
        matches.unshift(newMatch); // Ajout au début (plus récent)
        playSound(status);
      }

      saveData();
      closeModal();
      render();
    });

    function deleteMatch(id) {
      if (confirm('Supprimer ce bloc ?')) {
        matches = matches.filter(m => m.id !== id);
        saveData();
        render();
      }
    }

    function saveData() {
      localStorage.setItem('dbd_matches', JSON.stringify(matches));
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    function render() {
      const listContainer = document.getElementById('match-list');
      const statsView = document.getElementById('stats-view');

      if (currentTab === 'stats') {
        listContainer.style.display = 'none';
        statsView.classList.add('active');
        calculateStats();
        return;
      }

      listContainer.style.display = 'flex';
      statsView.classList.remove('active');
      listContainer.innerHTML = '';

      const filtered = matches.filter(m => {
        if (currentTab === 'all') return true;
        return m.status === currentTab;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = `<p style="text-align:center; color:var(--text-muted); margin-top:20px;">Aucune partie trouvée.</p>`;
        return;
      }

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = `match-card status-${m.status}`;
        card.innerHTML = `
          <div class="card-actions">
            <button class="btn-icon" onclick="openModal('${m.id}')">✏️</button>
            <button class="btn-icon" onclick="deleteMatch('${m.id}')">🗑️</button>
          </div>
          <div class="card-header">
            <span class="card-killer">🔪 ${escapeHtml(m.killer)}</span>
          </div>
          <div class="card-map">📍 ${escapeHtml(m.map)} — <small>${m.date}</small></div>
          <div class="card-details" style="margin-top:8px;">
            <span>⚙️ Gens: <b>${m.gens}/5</b></span>
            <span>🏃 Survivants sortis: <b>${m.escaped}/4</b></span>
          </div>
          ${m.notes ? `<div class="card-notes">${escapeHtml(m.notes)}</div>` : ''}
        `;
        listContainer.appendChild(card);
      });
    }

    function calculateStats() {
      const total = matches.length;
      if (total === 0) {
        document.getElementById('stat-survival').innerText = '0%';
        document.getElementById('stat-deadliest').innerText = '-';
        document.getElementById('stat-killers').innerHTML = '<li>Aucune donnée enregistrée</li>';
        return;
      }

      // Taux de survie global
      const escapes = matches.filter(m => m.status === 'green' || m.status === 'orange').length;
      const survivalRate = Math.round((escapes / total) * 100);
      document.getElementById('stat-survival').innerText = `${survivalRate}% (${escapes}/${total})`;

      // Compteurs par tueur
      const killerApperances = {};
      const killerDeaths = {};

      matches.forEach(m => {
        const k = m.killer.toLowerCase();
        killerApperances[k] = (killerApperances[k] || 0) + 1;
        if (m.status === 'red') {
          killerDeaths[k] = (killerDeaths[k] || 0) + 1;
        }
      });

      // Tueur le plus mortel (min 1 rencontre)
      let deadliestKiller = '-';
      let maxDeathRate = -1;

      Object.keys(killerApperances).forEach(k => {
        const deaths = killerDeaths[k] || 0;
        const rate = deaths / killerApperances[k];
        if (rate > maxDeathRate) {
          maxDeathRate = rate;
          deadliestKiller = k;
        }
      });

      const deadliestName = deadliestKiller.charAt(0).toUpperCase() + deadliestKiller.slice(1);
      const deadliestPercent = Math.round((maxDeathRate) * 100);
      document.getElementById('stat-deadliest').innerText = `${deadliestName} (${deadliestPercent}% de mort)`;

      // Taux d'apparition des tueurs
      const killerList = document.getElementById('stat-killers');
      killerList.innerHTML = '';

      // Trier les tueurs par nombre d'apparitions
      const sortedKillers = Object.keys(killerApperances).sort((a,b) => killerApperances[b] - killerApperances[a]);

      sortedKillers.forEach(k => {
        const count = killerApperances[k];
        const percent = Math.round((count / total) * 100);
        const nameFormatted = k.charAt(0).toUpperCase() + k.slice(1);
        
        const li = document.createElement('li');
        li.className = 'stat-item';
        li.innerHTML = `<span>🔪 ${escapeHtml(nameFormatted)}</span> <b>${percent}% (${count} game${count > 1 ? 's' : ''})</b>`;
        killerList.appendChild(li);
      });
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Affichage initial
    render();
  </script>
</body>
</html>
