<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBD Match Tracker V3</title>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #141418;
      --card-header: #1c1c22;
      --accent-red: #d92b2b;
      --accent-orange: #e67e22;
      --accent-green: #2ecc71;
      --text-color: #e0e0e0;
      --text-muted: #8e8e99;
      --border-color: #262630;
      --perk-bg: #1e1e26;
      --perk-border: #3a3a4a;
      --perk-accent: #8e44ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Trebuchet MS', 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 15px;
      max-width: 800px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      font-size: 1.8rem;
      text-shadow: 0 0 12px rgba(217, 43, 43, 0.6);
    }

    /* Main Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      transition: all 0.2s ease;
      text-align: center;
    }

    .nav-btn.active {
      background: var(--accent-red);
      color: white;
      border-color: var(--accent-red);
      box-shadow: 0 0 10px rgba(217, 43, 43, 0.4);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Streak Bar */
    .streak-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 15px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .streak-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      text-transform: uppercase;
      font-weight: bold;
    }

    .streak-dots {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0;
    }

    .streak-dot {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: white;
      flex-shrink: 0;
    }
    .streak-dot.green { background: var(--accent-green); }
    .streak-dot.orange { background: var(--accent-orange); }
    .streak-dot.red { background: var(--accent-red); }

    /* Controls Bar */
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 180px;
      padding: 10px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      font-size: 0.9rem;
    }

    .btn-tool {
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-main {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--accent-red);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(217, 43, 43, 0.3);
    }

    /* Status Filter Bar */
    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 15px;
      overflow-x: auto;
    }

    .filter-btn {
      padding: 8px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.85rem;
    }

    .filter-btn.active {
      background: #22222c;
      color: white;
      border-color: #555;
    }

    /* Autocomplete Selector UI */
    .custom-select-container {
      position: relative;
      width: 100%;
    }

    .selected-item-display {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0b0b0e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      cursor: pointer;
      min-height: 42px;
    }

    .selected-item-display img {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      object-fit: contain;
    }

    .autocomplete-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #141418;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 2000;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }

    .autocomplete-dropdown.open {
      display: block;
    }

    .autocomplete-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid #1a1a22;
    }

    .autocomplete-item:hover {
      background: #22222c;
    }

    .autocomplete-item img {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    /* Modal Form */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.88);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      overflow-y: auto;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      background: #0b0b0e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      font-size: 0.95rem;
    }

    .perks-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .perk-box {
      background: var(--perk-bg);
      border: 1px dashed var(--perk-border);
      border-radius: 8px;
      padding: 8px;
    }

    .radio-group { display: flex; gap: 8px; margin-top: 5px; }
    .radio-option { flex: 1; text-align: center; }
    .radio-option input { display: none; }
    .radio-option label {
      display: block;
      padding: 10px 5px;
      background: #0b0b0e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-color);
      font-weight: bold;
    }
    .radio-option input:checked + label.lbl-red { background: var(--accent-red); }
    .radio-option input:checked + label.lbl-orange { background: var(--accent-orange); }
    .radio-option input:checked + label.lbl-green { background: var(--accent-green); }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-secondary {
      background: #2a2a35;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
    }

    /* Cards */
    .match-list { display: flex; flex-direction: column; gap: 12px; }
    .match-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 14px;
      border-left: 5px solid var(--border-color);
      position: relative;
    }
    .match-card.status-red { border-left-color: var(--accent-red); }
    .match-card.status-orange { border-left-color: var(--accent-orange); }
    .match-card.status-green { border-left-color: var(--accent-green); }

    .card-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; }
    .btn-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; }

    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .card-header img { width: 40px; height: 40px; border-radius: 4px; object-fit: contain; }

    .card-details {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.85rem;
      margin: 8px 0;
      color: #ccc;
      background: #0b0b0e;
      padding: 8px;
      border-radius: 6px;
    }

    .card-perks-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .card-perk-tag {
      background: var(--perk-bg);
      border: 1px solid var(--perk-border);
      color: #d1c4e9;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .card-perk-tag img { width: 16px; height: 16px; }

    /* Stats View */
    .stat-box {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 12px;
    }
    .stat-title { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
    .stat-value { font-size: 1.4rem; font-weight: bold; color: white; }

    /* Randomizer View */
    .sub-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .sub-tab-btn {
      flex: 1;
      padding: 8px;
      background: #1c1c22;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }
    .sub-tab-btn.active { background: #2a2a35; color: white; border-color: #666; }

    .random-display {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .random-row { display: flex; align-items: center; gap: 12px; }
    .random-row img { width: 45px; height: 45px; object-fit: contain; background: #0b0b0e; border-radius: 6px; padding: 2px; }
    .random-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .random-card {
      background: #0b0b0e;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }
    .random-card img { width: 35px; height: 35px; object-fit: contain; }
  </style>
</head>
<body>

  <h1>DBD Match Tracker</h1>

  <!-- Main Navigation Tabs -->
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchNavTab('game')">Game</button>
    <button class="nav-btn" onclick="switchNavTab('stats')">Stats</button>
    <button class="nav-btn" onclick="switchNavTab('random')">Random</button>
  </div>

  <!-- TAB 1: GAME -->
  <div id="tab-game" class="tab-content active">
    <div class="streak-container">
      <span class="streak-title">Derniers Matchs:</span>
      <div class="streak-dots" id="streak-dots">
        <span style="color:var(--text-muted); font-size:0.8rem;">Aucune partie</span>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="search-bar" class="search-input" placeholder="🔍 Rechercher (Tueur, Map, Perk...)" oninput="render()">
      <button class="btn-tool" onclick="exportData()">💾 Exporter</button>
      <button class="btn-tool" onclick="document.getElementById('import-file').click()">📂 Importer</button>
      <input type="file" id="import-file" style="display:none" accept=".json" onchange="importData(event)">
    </div>

    <button class="btn-main" onclick="openModal()">+ Ajouter une partie</button>

    <div class="filter-tabs">
      <button class="filter-btn active" onclick="switchFilterTab('all', event)">Tous (<span id="count-all">0</span>)</button>
      <button class="filter-btn" onclick="switchFilterTab('green', event)">🟢 Porte (<span id="count-green">0</span>)</button>
      <button class="filter-btn" onclick="switchFilterTab('orange', event)">🟠 Trappe (<span id="count-orange">0</span>)</button>
      <button class="filter-btn" onclick="switchFilterTab('red', event)">🔴 Mort (<span id="count-red">0</span>)</button>
    </div>

    <div id="match-list" class="match-list"></div>
  </div>

  <!-- TAB 2: STATS -->
  <div id="tab-stats" class="tab-content">
    <div class="stat-box">
      <div class="stat-title">Taux de Survie Global</div>
      <div class="stat-value" id="stat-survival">0%</div>
    </div>
    <div class="stat-box">
      <div class="stat-title">Tueur le Plus Mortel</div>
      <div class="stat-value" id="stat-deadliest">-</div>
    </div>
    <div class="stat-box">
      <div class="stat-title">Taux d'Apparition des Tueurs</div>
      <ul style="list-style:none; margin-top:8px;" id="stat-killers"></ul>
    </div>
  </div>

  <!-- TAB 3: RANDOMIZER -->
  <div id="tab-random" class="tab-content">
    <div class="sub-tabs">
      <button class="sub-tab-btn active" id="btn-sub-surv" onclick="switchRandomTab('survivor')">Survivant</button>
      <button class="sub-tab-btn" id="btn-sub-killer" onclick="switchRandomTab('killer')">Tueur</button>
    </div>

    <button class="btn-main" style="background:#8e44ad;" onclick="generateRandomBuild()">🎲 PRÊT</button>

    <div class="random-display" id="random-container">
      <!-- Generated content -->
    </div>
  </div>

  <!-- Modal Form -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modal-title" style="margin-bottom: 12px; font-size:1.3rem;">Nouvelle Partie</h2>
      <form id="match-form">
        <input type="hidden" id="match-id">
        
        <!-- Killer Visual Selector -->
        <div class="form-group">
          <label>Tueur</label>
          <div class="custom-select-container">
            <input type="text" id="killer-search" placeholder="Tape pour chercher un tueur..." oninput="filterAutocomplete('killer')" onfocus="openAutocomplete('killer')">
            <input type="hidden" id="killer-value">
            <div class="autocomplete-dropdown" id="killer-dropdown"></div>
          </div>
        </div>

        <!-- Survivor Visual Selector -->
        <div class="form-group">
          <label>Personnage Joué</label>
          <div class="custom-select-container">
            <input type="text" id="survivor-search" placeholder="Tape pour chercher un personnage..." oninput="filterAutocomplete('survivor')" onfocus="openAutocomplete('survivor')">
            <input type="hidden" id="survivor-value">
            <div class="autocomplete-dropdown" id="survivor-dropdown"></div>
          </div>
        </div>

        <!-- Map Visual Selector -->
        <div class="form-group">
          <label>Map</label>
          <div class="custom-select-container">
            <input type="text" id="map-search" placeholder="Tape pour chercher une carte..." oninput="filterAutocomplete('map')" onfocus="openAutocomplete('map')">
            <input type="hidden" id="map-value">
            <div class="autocomplete-dropdown" id="map-dropdown"></div>
          </div>
        </div>

        <div style="display:flex; gap:10px;">
          <div class="form-group" style="flex:1;">
            <label for="gens">Générateurs</label>
            <input type="number" id="gens" min="0" max="5" value="5">
          </div>
          <div class="form-group" style="flex:1;">
            <label for="escaped">Évadés (0 à 4)</label>
            <input type="number" id="escaped" min="0" max="4" value="1" oninput="autoCheckStatus()">
          </div>
        </div>

        <div class="form-group">
          <label for="hooks">Fois accroché</label>
          <select id="hooks">
            <option value="0">0 fois (Jamais)</option>
            <option value="1">1 fois</option>
            <option value="2">2 fois</option>
          </select>
        </div>

        <!-- Perks Section -->
        <div class="form-group">
          <label>Tes Perks (4 Emplacements)</label>
          <div class="perks-grid">
            <div class="perk-box">
              <input type="text" id="perk1-search" placeholder="Perk 1..." oninput="filterAutocomplete('perk1')" onfocus="openAutocomplete('perk1')">
              <input type="hidden" id="perk1-value">
              <div class="autocomplete-dropdown" id="perk1-dropdown"></div>
            </div>
            <div class="perk-box">
              <input type="text" id="perk2-search" placeholder="Perk 2..." oninput="filterAutocomplete('perk2')" onfocus="openAutocomplete('perk2')">
              <input type="hidden" id="perk2-value">
              <div class="autocomplete-dropdown" id="perk2-dropdown"></div>
            </div>
            <div class="perk-box">
              <input type="text" id="perk3-search" placeholder="Perk 3..." oninput="filterAutocomplete('perk3')" onfocus="openAutocomplete('perk3')">
              <input type="hidden" id="perk3-value">
              <div class="autocomplete-dropdown" id="perk3-dropdown"></div>
            </div>
            <div class="perk-box">
              <input type="text" id="perk4-search" placeholder="Perk 4..." oninput="filterAutocomplete('perk4')" onfocus="openAutocomplete('perk4')">
              <input type="hidden" id="perk4-value">
              <div class="autocomplete-dropdown" id="perk4-dropdown"></div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Résultat de ta partie</label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="out-red" name="status" value="red" checked>
              <label for="out-red" class="lbl-red">Mort 🔴</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="out-orange" name="status" value="orange">
              <label for="out-orange" class="lbl-orange">Trappe 🟠</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="out-green" name="status" value="green">
              <label for="out-green" class="lbl-green">Porte 🟢</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" placeholder="Ex: Tunnel, clutch..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeModal()">Annuler</button>
          <button type="submit" class="btn-main" style="margin:0; flex:1;">Terminé</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // GAME DATABASE (v10.0.2 Included)
    const DEFAULT_ICON = "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/1/14/Help_icon.png";

    const DB = {
      killers: [
        { id: "jason", name: "Jason Voorhees", icon: "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/a/a5/K35_charSelect_portrait.png" },
        { id: "trapper", name: "Le Piégeur", icon: "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/4/47/K01_charSelect_portrait.png" },

        { id: "hillbilly", name: "Le Montagnard", icon: "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/0/00/K03_charSelect_portrait.png" },
        { id: "nurse", name: "La Lecheresse / Nurse", icon: "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/3/30/K04_charSelect_portrait.png" },

      ],

        { id: "shane", name: "Shane", icon: "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/8/87/S40_charSelect_portrait.png" },
        { id: "dwight", name: "Dwight Fairfield", icon: "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/d/d4/S01_charSelect_portrait.png" },
        { id: "meg", name: "Meg Thomas", icon: "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/3/33/S02_charSelect_portrait.png" },
        { id: "claudette", name: "Claudette Morel", icon: "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/0/05/S03_charSelect_portrait.png" },

      ],
      maps: [
        { id: "camp_crystal", name: "Camp Crystal Lake", icon: DEFAULT_ICON },
        { id: "ormond", name: "Ormond", icon: DEFAULT_ICON },
        { id: "rpd", name: "Commissariat de Raccoon City (RPD)", icon: DEFAULT_ICON },
        { id: "autohaven", name: "Casse Autohaven", icon: DEFAULT_ICON }
      ],
      survivorPerks: [
        { id: "decisive_strike", name: "Coup décisif", icon: "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/e/ee/DecisiveStrike.png" },
        { id: "dead_hard", name: "Course échevelée", icon: "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/8/82/DeadHard.png" },
        { id: "self_care", name: "Auto-soin", icon: "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/a/ab/Self-Care.png" },
        { id: "adrenaline", name: "Adrénaline", icon: "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/f/f7/Adrenaline.png" }
      ],
      killerPerks: [
        { id: "barbecue", name: "Barbecue & Chili", icon: "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/3/34/BarbecueAndChili.png" },
        { id: "ruin", name: "Sort : Ruine", icon: "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/1/1a/HexRuin.png" },
        { id: "corrupt", name: "Intervention corrompue", icon: "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/2/23/CorruptIntervention.png" },
        { id: "noed", name: "Sort : Personne n'échappe à la mort", icon: "https://static.wikia.nocookie.net/deadbydaylight_gamepedia_en/images/c/c2/HexNoOneEscapesDeath.png" }
      ],
      items: [
        { id: "medkit", name: "Trousse de secours", icon: DEFAULT_ICON },
        { id: "flashlight", name: "Lampe torche", icon: DEFAULT_ICON },
        { id: "toolbox", name: "Boîte à outils", icon: DEFAULT_ICON }
      ],
      addons: [
        { id: "addon_1", name: "Gaze stérile", icon: DEFAULT_ICON },
        { id: "addon_2", name: "Piles neuves", icon: DEFAULT_ICON },
        { id: "addon_3", name: "Filtre puissant", icon: DEFAULT_ICON }
      ],
      offerings: [
        { id: "offering_1", name: "Gâteau d'anniversaire", icon: DEFAULT_ICON },
        { id: "offering_2", name: "Pousse de sang", icon: DEFAULT_ICON }
      ]
    };

    // Application State
    let matches = JSON.parse(localStorage.getItem('dbd_matches')) || [];
    let currentFilter = 'all';
    let currentRandomType = 'survivor';

    // Audio Web API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'green') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.3);
      } else if (type === 'orange') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(349.23, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.3);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.4);
      }
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    // Tab Navigation
    function switchNavTab(tabName) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(`tab-${tabName}`).classList.add('active');

      if (tabName === 'stats') calculateStats();
      if (tabName === 'random') generateRandomBuild();
    }

    function switchFilterTab(filter, event) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    function switchRandomTab(type) {
      currentRandomType = type;
      document.getElementById('btn-sub-surv').classList.toggle('active', type === 'survivor');
      document.getElementById('btn-sub-killer').classList.toggle('active', type === 'killer');
      generateRandomBuild();
    }

    // Autocomplete UI logic
    function setupAutocompleteFields() {
      const fields = [
        { type: 'killer', data: DB.killers },
        { type: 'survivor', data: DB.survivors },
        { type: 'map', data: DB.maps },
        { type: 'perk1', data: DB.survivorPerks },
        { type: 'perk2', data: DB.survivorPerks },
        { type: 'perk3', data: DB.survivorPerks },
        { type: 'perk4', data: DB.survivorPerks }
      ];

      fields.forEach(field => {
        const input = document.getElementById(`${field.type}-search`);
        const dropdown = document.getElementById(`${field.type}-dropdown`);
        
        input.addEventListener('focus', () => renderDropdown(field.type, field.data, input.value));
        input.addEventListener('input', () => renderDropdown(field.type, field.data, input.value));
      });
    }

    function renderDropdown(type, list, filterText) {
      const dropdown = document.getElementById(`${type}-dropdown`);
      dropdown.innerHTML = '';
      
      const filtered = list.filter(item => item.name.toLowerCase().includes(filterText.toLowerCase()));
      
      if (filtered.length === 0) {
        dropdown.classList.remove('open');
        return;
      }

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'autocomplete-item';
        div.innerHTML = `<img src="${item.icon}" onerror="this.src='${DEFAULT_ICON}'"> <span>${item.name}</span>`;
        div.onclick = () => {
          document.getElementById(`${type}-search`).value = item.name;
          document.getElementById(`${type}-value`).value = item.id;
          dropdown.classList.remove('open');
        };
        dropdown.appendChild(div);
      });

      dropdown.classList.add('open');
    }

    // Close autocomplete when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.custom-select-container')) {
        document.querySelectorAll('.autocomplete-dropdown').forEach(el => el.classList.remove('open'));
      }
    });

    // Randomizer Algorithm
    function getRandom(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function getRandomUnique(array, count) {
      const shuffled = [...array].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count);
    }

    function generateRandomBuild() {
      const container = document.getElementById('random-container');
      container.innerHTML = '';

      if (currentRandomType === 'survivor') {
        const char = getRandom(DB.survivors);
        const perks = getRandomUnique(DB.survivorPerks, 4);
        const item = getRandom(DB.items);
        const addons = getRandomUnique(DB.addons, 2);
        const offering = getRandom(DB.offerings);

        container.innerHTML = `
          <div class="random-row">
            <img src="${char.icon}" onerror="this.src='${DEFAULT_ICON}'">
            <div><strong>Personnage:</strong> ${char.name}</div>
          </div>
          <div><strong>Perks:</strong></div>
          <div class="random-grid">
            ${perks.map(p => `<div class="random-card"><img src="${p.icon}" onerror="this.src='${DEFAULT_ICON}'"> ${p.name}</div>`).join('')}
          </div>
          <div><strong>Équipement:</strong></div>
          <div class="random-grid">
            <div class="random-card"><img src="${item.icon}" onerror="this.src='${DEFAULT_ICON}'"> ${item.name}</div>
            <div class="random-card"><img src="${offering.icon}" onerror="this.src='${DEFAULT_ICON}'"> ${offering.name}</div>
          </div>
          <div><strong>Add-ons:</strong></div>
          <div class="random-grid">
            ${addons.map(a => `<div class="random-card"><img src="${a.icon}" onerror="this.src='${DEFAULT_ICON}'"> ${a.name}</div>`).join('')}
          </div>
        `;
      } else {
        const killer = getRandom(DB.killers);
        const perks = getRandomUnique(DB.killerPerks, 4);
        const addons = getRandomUnique(DB.addons, 2);
        const offering = getRandom(DB.offerings);

        container.innerHTML = `
          <div class="random-row">
            <img src="${killer.icon}" onerror="this.src='${DEFAULT_ICON}'">
            <div><strong>Tueur:</strong> ${killer.name}</div>
          </div>
          <div><strong>Perks:</strong></div>
          <div class="random-grid">
            ${perks.map(p => `<div class="random-card"><img src="${p.icon}" onerror="this.src='${DEFAULT_ICON}'"> ${p.name}</div>`).join('')}
          </div>
          <div><strong>Add-ons & Offrande:</strong></div>
          <div class="random-grid">
            <div class="random-card"><img src="${addons[0].icon}" onerror="this.src='${DEFAULT_ICON}'"> ${addons[0].name}</div>
            <div class="random-card"><img src="${addons[1].icon}" onerror="this.src='${DEFAULT_ICON}'"> ${addons[1].name}</div>
            <div class="random-card" style="grid-column: span 2;"><img src="${offering.icon}" onerror="this.src='${DEFAULT_ICON}'"> ${offering.name}</div>
          </div>
        `;
      }
    }

    // Modal & CRUD Operations
    const modal = document.getElementById('modal');
    const form = document.getElementById('match-form');

    function openModal() {
      form.reset();
      document.getElementById('match-id').value = '';
      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const killerName = document.getElementById('killer-search').value.trim() || 'Inconnu';
      const mapName = document.getElementById('map-search').value.trim() || 'Map non spécifiée';
      const status = document.querySelector('input[name="status"]:checked').value;

      const newMatch = {
        id: Date.now().toString(),
        killer: killerName,
        map: mapName,
        gens: document.getElementById('gens').value,
        status: status,
        escaped: document.getElementById('escaped').value,
        hooks: document.getElementById('hooks').value,
        perks: [
          document.getElementById('perk1-search').value,
          document.getElementById('perk2-search').value,
          document.getElementById('perk3-search').value,
          document.getElementById('perk4-search').value
        ].filter(p => p.trim() !== ''),
        notes: document.getElementById('notes').value.trim(),
        date: new Date().toLocaleDateString('fr-FR')
      };

      matches.unshift(newMatch);
      playSound(status);
      saveData();
      closeModal();
      render();
    });

    function deleteMatch(id) {
      if (confirm('Supprimer ce bloc ?')) {
        matches = matches.filter(m => m.id !== id);
        saveData();
        render();
      }
    }

    function saveData() {
      localStorage.setItem('dbd_matches', JSON.stringify(matches));
    }

    function autoCheckStatus() {
      if (parseInt(document.getElementById('escaped').value) === 0) {
        document.getElementById('out-red').checked = true;
      }
    }

    function render() {
      renderStreak();
      updateTabCounts();

      const listContainer = document.getElementById('match-list');
      const searchVal = document.getElementById('search-bar').value.toLowerCase().trim();

      listContainer.innerHTML = '';

      const filtered = matches.filter(m => {
        if (currentFilter !== 'all' && m.status !== currentFilter) return false;
        if (searchVal) {
          return m.killer.toLowerCase().includes(searchVal) ||
                 m.map.toLowerCase().includes(searchVal) ||
                 m.perks.some(p => p.toLowerCase().includes(searchVal));
        }
        return true;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = `<p style="text-align:center; color:var(--text-muted); margin-top:20px;">Aucune partie enregistrée.</p>`;
        return;
      }

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = `match-card status-${m.status}`;
        card.innerHTML = `
          <div class="card-actions">
            <button class="btn-icon" onclick="deleteMatch('${m.id}')">🗑️</button>
          </div>
          <div class="card-header">
            <div>
              <strong style="font-size:1.1rem; color:#fff;">🔪 ${m.killer}</strong>
              <div style="font-size:0.85rem; color:var(--text-muted);">📍 ${m.map} — <small>${m.date}</small></div>
            </div>
          </div>
          <div class="card-details">
            <span>⚙️ Gens: <b>${m.gens}/5</b></span>
            <span>🏃 Sortis: <b>${m.escaped}/4</b></span>
            <span>🪝 Accroché: <b>${m.hooks} fois</b></span>
          </div>
          ${m.perks.length ? `<div class="card-perks-list">${m.perks.map(p => `<span class="card-perk-tag">💎 ${p}</span>`).join('')}</div>` : ''}
          ${m.notes ? `<div style="font-size:0.8rem; background:#0b0b0e; padding:6px; margin-top:6px; border-radius:4px; color:#aaa;">${m.notes}</div>` : ''}
        `;
        listContainer.appendChild(card);
      });
    }

    function renderStreak() {
      const streakContainer = document.getElementById('streak-dots');
      streakContainer.innerHTML = '';
      const lastMatches = matches.slice(0, 10);

      if (lastMatches.length === 0) {
        streakContainer.innerHTML = `<span style="color:var(--text-muted); font-size:0.8rem;">Aucune partie</span>`;
        return;
      }

      lastMatches.forEach(m => {
        const dot = document.createElement('div');
        dot.className = `streak-dot ${m.status}`;
        dot.innerText = m.status === 'green' ? '✓' : (m.status === 'orange' ? '★' : '✕');
        streakContainer.appendChild(dot);
      });
    }

    function updateTabCounts() {
      document.getElementById('count-all').innerText = matches.length;
      document.getElementById('count-green').innerText = matches.filter(m => m.status === 'green').length;
      document.getElementById('count-orange').innerText = matches.filter(m => m.status === 'orange').length;
      document.getElementById('count-red').innerText = matches.filter(m => m.status === 'red').length;
    }

    function calculateStats() {
      const total = matches.length;
      if (total === 0) return;

      const escapes = matches.filter(m => m.status === 'green' || m.status === 'orange').length;
      document.getElementById('stat-survival').innerText = `${Math.round((escapes / total) * 100)}% (${escapes}/${total})`;

      const killerCounts = {};
      matches.forEach(m => killerCounts[m.killer] = (killerCounts[m.killer] || 0) + 1);

      const sorted = Object.keys(killerCounts).sort((a,b) => killerCounts[b] - killerCounts[a]);
      document.getElementById('stat-deadliest').innerText = sorted[0] || '-';

      const killerList = document.getElementById('stat-killers');
      killerList.innerHTML = sorted.map(k => `<li style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #1a1a22;"><span>🔪 ${k}</span><b>${Math.round((killerCounts[k]/total)*100)}%</b></li>`).join('');
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(matches));
      const anchor = document.createElement('a');
      anchor.setAttribute("href", dataStr);
      anchor.setAttribute("download", `dbd_tracker_backup.json`);
      anchor.click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        matches = JSON.parse(e.target.result);
        saveData();
        render();
      };
      reader.readAsText(file);
    }

    // Initialize
    setupAutocompleteFields();
    render();
  </script>
</body>
</html>
